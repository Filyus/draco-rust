[package]
name = "draco-cpp-test-bridge"
version = "0.1.0"
edition = "2021"
description = "Internal C++ test bridge for Rust parity and performance tests"
publish = false

[dependencies]

[features]
# Count the corner table's array loads on the Rust side, for the comparison
# against the instrumented C++ described in PERFORMANCE.md. Counts only --
# a build carrying these counters is never a build to time.
count_table_loads = ["draco-core/count_table_loads"]
# Run the matrices against mimalloc instead of the platform allocator. The
# decode gap is load-identical against C++, which leaves memory behaviour as
# the candidate; this is how that is tested without touching draco-core.
# Never a library dependency -- allocator choice is the consumer's, as PGO is.
mimalloc = []

[build-dependencies]
cc = "1.0"

[dev-dependencies]
# Not optional, because Cargo forbids optional dev-dependencies; the feature
# only decides whether the examples install it as the global allocator.
mimalloc = "0.1"
# Per-site heap totals for the decode_dhat example. Profiling only -- a dhat
# build is never a timing build; its allocator wrapper records a backtrace
# per allocation.
dhat = "0.3"
draco-core = { path = "../draco-core" }
draco-io = { path = "../draco-io" }
