[package]
name = "draco-gltf"
version = "0.2.0"
edition = "2021"
description = "Load and save full glTF 2.0 and 2.1 draft scenes with Draco geometry"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
readme = "README.md"
keywords = ["draco", "gltf", "glb", "compression", "scene"]
categories = ["compression", "graphics", "rendering::data-formats"]
exclude = ["tests/roundtrip_test.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
draco-core = { version = "1.0.0", path = "../draco-core", default-features = false }
# The shared container/resource layer lives in draco-io; this crate owns the
# full scene model and document-preserving transforms.
draco-io = { version = "0.3.0", path = "../draco-io", default-features = false }
thiserror = "2.0"

[features]
default = ["full"]
# Lossless JSON DOM, typed root views, GLB and resource contracts. This is the
# common base for scene and geometry consumers.
document = ["draco-io/gltf"]
# Accessor materialization and PackedGeometry contracts.
geometry = ["document", "draco-io/gltf-geometry"]
# KHR_draco_mesh_compression decoding and Draco-backed packed geometry.
draco-decode = ["geometry", "draco-io/draco-decode", "draco-core/decoder", "draco-core/point_cloud_decode", "draco-core/edgebreaker_valence_decode"]
# Explicit `files` loading and resolver/provenance controls.
resources = ["document"]
# Strict scene cross-reference validation; the DOM remains lossless without it.
scene-validation = ["document"]
# Ordinary primitive reading with resources and strict scene validation.
read = ["geometry", "resources", "scene-validation"]
# Generic accessor materialization, including matrix accessors used by skins.
accessors = ["read"]
# Raw accessor construction and document geometry mutation.
write = ["read"]
# Document-preserving Draco encoding. Decoding is required for recompression and
# atomic decompression transforms.
draco-encode = ["write", "draco-decode", "draco-core/encoder"]
# Release-grade scene API.
full = ["read", "accessors", "draco-decode", "write", "draco-encode"]
# Repository-fixture tests are intentionally opt-in and are not run from the
# published crate tarball, which has no access to the workspace testdata tree.
test = []

[[example]]
name = "gltf_tool"
required-features = ["draco-encode"]
