[package]
name = "draco-gltf"
version = "0.2.0"
edition = "2021"
description = "Load and save full glTF 2.0 and 2.1 draft scenes with Draco geometry"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
readme = "README.md"
keywords = ["draco", "gltf", "glb", "compression", "scene"]
categories = ["compression", "graphics", "rendering::data-formats"]
exclude = ["tests/roundtrip_test.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
draco-core = { version = "1.0.0", path = "../draco-core", default-features = false, features = ["decoder", "encoder", "point_cloud_decode", "edgebreaker_valence_decode"] }
# The shared container/resource layer and document-preserving compressor live
# in draco-io; this crate owns the full scene model.
draco-io = { version = "0.3.0", path = "../draco-io", default-features = false, features = ["gltf"] }
thiserror = "2.0"

[features]
default = []
compact = []
# Decode embedded/external images through the shared resource resolver and the
# `image` crate (PNG/JPEG codecs — the largest part of the build). Without it,
# images are not decoded and `Import.images` is absent; glTF buffers still use
# the same strict resolver. Useful for wasm and conversion pipelines where the
# geometry, not the texture pixels, is what matters.
# Repository-fixture tests are intentionally opt-in and are not run from the
# published crate tarball, which has no access to the workspace testdata tree.
test = []
