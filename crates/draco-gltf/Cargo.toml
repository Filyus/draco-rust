[package]
name = "draco-gltf"
version = "0.4.0"
edition = "2021"
rust-version = "1.88.0"
description = "Load and save full glTF 2.0 and 2.1 draft scenes with Draco geometry"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
readme = "README.md"
keywords = ["draco", "gltf", "glb", "compression", "scene"]
categories = ["compression", "graphics", "rendering::data-formats"]
# The probe is a research instrument, `#[ignore]`d, that reads its scene
# through the environment; it is left out as `draco-core`'s probes are.
exclude = ["tests/roundtrip_test.rs", "tests/*_probe.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lints.clippy]
# `unsafe` is permitted here on the same terms as `draco-io` -- see SECURITY.md,
# "Memory safety" -- and every block must carry a `// SAFETY:` justification. CI
# runs clippy with `-D warnings`, so `warn` is enforced rather than advisory.
#
# `draco-core` forbids `unsafe` outright instead. What is hot here is buffer
# views, accessor strides, meshopt filters and JSON, which is byte shuffling of
# a shape that unchecked indexing actually helps, and each site is small enough
# to audit on its own. That is a different risk profile from a bitstream
# decoder running on attacker-controlled indices, not a lower standard.
undocumented_unsafe_blocks = "warn"

[dependencies]
draco-core = { version = "2.1.0", path = "../draco-core", default-features = false }
thiserror = "2.0"

[features]
default = ["full"]
# Lossless JSON DOM, typed root views, GLB and resource contracts. This is the
# common base for scene and geometry consumers, and it is not optional in
# practice: document, json, extensions, container, meshopt and import are all
# unconditional, and Error and the crate-root re-exports name types from them.
# The feature is kept so the graph still reads correctly for a caller enabling
# features one at a time, but turning it off compiles no less.
document = []
# Accessor materialization and PackedGeometry contracts.
geometry = ["document"]
# KHR_draco_mesh_compression decoding and Draco-backed packed geometry.
draco-decode = ["geometry", "draco-core/decoder", "draco-core/point_cloud_decode", "draco-core/edgebreaker_valence_decode"]
# Optional compatibility mode for reading older Draco bitstreams embedded in
# KHR_draco_mesh_compression payloads. Writers still emit the current bitstream.
legacy-bitstream-decode = ["draco-core/legacy_bitstream_decode"]
# Explicit `files` loading and resolver/provenance controls.
resources = ["document"]
# Strict cross-reference, node-tree, and POSITION-bounds validation. The DOM
# remains lossless and the reader remains bounds-safe without this pass.
strict-validation = ["document"]
# Ordinary bounds-safe primitive reading with explicit resources.
read = ["geometry", "resources"]
# Generic accessor materialization, including matrix accessors used by skins.
accessors = ["read"]
# Raw accessor construction and document geometry mutation.
write = ["read", "strict-validation"]
# Document-preserving Draco encoding. Decoding is required for recompression and
# atomic decompression transforms.
# The valence traversal is enabled on both sides deliberately. Without the
# encoder half, `select_edgebreaker_traversal` can only ever answer "standard",
# so every encoding speed below 5 -- the whole range where Draco asks for it --
# writes the same stream as speed 5 does.
draco-encode = ["write", "draco-decode", "draco-core/encoder", "draco-core/edgebreaker_valence_encode"]
# Release-grade scene API.
full = ["read", "accessors", "strict-validation", "draco-decode", "write", "draco-encode"]
# Repository-fixture tests are intentionally opt-in and are not run from the
# published crate tarball, which has no access to the workspace testdata tree.
test = []

[[example]]
name = "gltf_tool"
required-features = ["draco-encode"]
