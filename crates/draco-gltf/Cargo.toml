[package]
name = "draco-gltf"
version = "0.1.0"
edition = "2021"
description = "Load and save full glTF scenes with Draco geometry, bridging gltf-rs and draco-core/draco-io"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
readme = "README.md"
keywords = ["draco", "gltf", "glb", "compression", "scene"]
categories = ["compression", "graphics", "rendering::data-formats"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extensions"] }
draco-core = { version = "1.0.0", path = "../draco-core", default-features = false, features = ["decoder", "point_cloud_decode", "edgebreaker_valence_decode"] }
# Only the writer + the reader-agnostic geometry decoder are needed; draco-gltf
# reads geometry through gltf-rs, not draco-io's glTF reader.
draco-io = { version = "0.1.0", path = "../draco-io", default-features = false, features = ["gltf-writer"] }
serde_json = "1.0"
thiserror = "2.0"

[features]
default = ["image"]
# Decode embedded/external images via gltf-rs's `import` (pulls the `image`
# crate with PNG/JPEG codecs — the largest part of the build). Without it,
# images are not decoded, external resources are resolved by a small built-in
# loader, and `Import.images` is absent. Useful for wasm and conversion
# pipelines where the geometry, not the texture pixels, is what matters.
image = ["gltf/import"]
