[package]
name = "draco-core"
version = "2.0.0"
edition = "2021"
description = "Pure Rust core encoder and decoder for Draco geometry compression"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
readme = "README.md"
keywords = ["draco", "compression", "mesh", "point-cloud", "geometry"]
categories = ["compression", "encoding", "graphics", "wasm"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
# SECURITY.md promises this crate contains no `unsafe`. Until now that was a
# sentence in a document; here it is a build failure. `forbid` rather than
# `deny` so no module can lift it locally.
#
# It is a rule for this crate and not for `draco-io`, and the asymmetry is
# deliberate: the algorithms here -- rANS, edgebreaker traversal, the
# prediction schemes -- are intricate enough that a memory-safety bug in them
# would be hard to find by review, and they run on bitstream-controlled indices
# throughout. See SECURITY.md.
unsafe_code = "forbid"

[features]
default = [
    "encoder",
    "decoder",
    "point_cloud_decode",
    "edgebreaker_valence_encode",
    "edgebreaker_valence_decode",
    "legacy_bitstream_encode",
    "legacy_bitstream_decode",
]
encoder = []
decoder = []
point_cloud_decode = ["decoder"]
edgebreaker_valence_encode = ["encoder"]
edgebreaker_valence_decode = ["decoder"]
legacy_bitstream_encode = ["encoder"]
legacy_bitstream_decode = ["decoder"]
count_table_loads = []
debug_logs = []
force_sequential_seeds = []

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }

[dev-dependencies]
draco-io = { path = "../draco-io" }
tempfile = "3.24.0"
