[package]
name = "draco-texture"
version = "0.1.0"
edition = "2021"
description = "KTX2 container reading and Basis Universal transcoding for the Draco web tools"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
# Not part of the published Draco surface: this crate exists so the browser
# converter can show KHR_texture_basisu textures, and it is shipped inside the
# WASM release assets rather than on crates.io.
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
thiserror = "2.0"
# Zstd supercompression, which every UASTC file written by `toktx --zstd` uses.
# Pure Rust and allocation-only, so it survives the wasm32 target unchanged.
ruzstd = { version = "0.7", default-features = false, features = ["std"] }

[dev-dependencies]
# For the golden manifest: the transcoder's output is pinned by hash, so the
# ordinary test suite carries the byte-exactness claim without needing either
# oracle present.
sha2 = "0.10"

[features]
# Everything, which is what a build for the web converter wants:
# `KHR_texture_basisu` lets a KTX2 file hold either Basis codec, so a reader
# with one of them refuses half the files it is pointed at.
default = ["etc1s", "uastc", "block-formats"]
# Basis Universal ETC1S decoding.
etc1s = []
# Basis Universal UASTC LDR decoding.
uastc = []
# Transcoding to the block formats a GPU can sample directly, rather than
# decoding to pixels. This is what carries the baked endpoint tables, which
# are most of the crate's compiled size - a consumer that only wants pixels
# should leave all three off.
#
# Split by the family of hardware each one serves, because that is the axis
# along which they go out of date: a target is worth carrying for exactly as
# long as machines that take it are worth serving, and every one of these
# will one day stop being. The alternative axis - one flag per target - cuts
# where nothing ever changes, since BC1 and BC3 arrive and leave together.
#
# Desktop: BC1 and BC3 for ETC1S, BC7 for UASTC. `WEBGL_compressed_texture_s3tc`
# and `EXT_texture_compression_bptc`. Carries the baked BC1 and BC4 tables.
bc = []
# Mobile: ETC1 and ETC2 for ETC1S. `WEBGL_compressed_texture_etc`. Load-bearing
# rather than old, for the reason set out below the umbrella.
etc = []
# Mobile: ASTC 4x4 for UASTC, and only UASTC. `WEBGL_compressed_texture_astc`.
astc = []
# All three, for a build that does not know what it will be run on. This is
# what the web converter takes, since a browser can be any of them.
block-formats = ["bc", "etc", "astc"]

# There is deliberately no `legacy` flag over these yet, though the shape of
# one is obvious and I built it before checking what it would retire.
#
# `etc` looks legacy by the survey: every machine with ASTC also has ETC, so
# the family appears to serve only the gap between them, which is nil on
# Android and about six points on Linux. But ETC1S - the codec most glTF
# assets use - has no ASTC target here, only ETC. So `etc` is not the gap
# between two mobile formats: it is the only compressed path ETC1S has on any
# phone at all, and dropping it would send the common codec to RGBA8 on the
# machines least able to afford eight times the video memory.
#
# Transcoding ETC1S to ASTC is what would make the split true, and until that
# exists a policy layer here would only encode an answer that is wrong.
