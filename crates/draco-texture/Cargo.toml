[package]
name = "draco-texture"
version = "0.1.0"
edition = "2021"
description = "KTX2 container reading and Basis Universal transcoding for the Draco web tools"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
# Not part of the published Draco surface: this crate exists so the browser
# converter can show KHR_texture_basisu textures, and it is shipped inside the
# WASM release assets rather than on crates.io.
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
thiserror = "2.0"
# Zstd supercompression, which every UASTC file written by `toktx --zstd` uses.
# Pure Rust and allocation-only, so it survives the wasm32 target unchanged.
ruzstd = { version = "0.7", default-features = false, features = ["std"] }

[features]
# Everything, which is what a build for the web converter wants:
# `KHR_texture_basisu` lets a KTX2 file hold either Basis codec, so a reader
# with one of them refuses half the files it is pointed at.
default = ["etc1s", "uastc", "modern", "legacy"]
# Basis Universal ETC1S decoding.
etc1s = []
# Basis Universal UASTC LDR decoding.
uastc = []
# Transcoding to the block formats a GPU can sample directly, rather than
# decoding to pixels. This is what carries the baked endpoint tables, which
# are most of the crate's compiled size - a consumer that only wants pixels
# should leave all three off.
#
# Split by the family of hardware each one serves, because that is the axis
# along which they go out of date: a target is worth carrying for exactly as
# long as machines that take it are worth serving, and every one of these
# will one day stop being. The alternative axis - one flag per target - cuts
# where nothing ever changes, since BC1 and BC3 arrive and leave together.
#
# Desktop: BC1 and BC3 for ETC1S, BC7 for UASTC. `WEBGL_compressed_texture_s3tc`
# and `EXT_texture_compression_bptc`. Carries the baked BC1 and BC4 tables.
bc = []
# Older mobile: ETC1 and ETC2 for ETC1S. `WEBGL_compressed_texture_etc`. Every
# machine with ASTC also has this, so this is the flag that ages out first -
# it exists for the ones that have ETC and not ASTC.
etc = []
# Modern mobile: ASTC 4x4 for UASTC. `WEBGL_compressed_texture_astc`.
astc = []
# All three, for a build that does not know what it will be run on. This is
# what the web converter takes, since a browser can be any of them.
block-formats = ["bc", "etc", "astc"]

# The two above say what a target is; these two say why it is still here. A
# family's membership changes as hardware turns over, so the names carry the
# policy and the lists carry today's answer - which is the only part that has
# to be revisited when the figures move.
#
# What a machine sold today takes. Both halves of the desktop-mobile split,
# because "modern" is about the hardware being current, not about it being
# one kind: s3tc is on 99.9% of Windows and ASTC on essentially every phone.
modern = ["bc", "astc"]
# What is carried only for hardware with no current alternative. Today that is
# `etc` and only `etc`: every machine with ASTC also has ETC, so the family
# serves exactly the devices that have one and not the other. On Android that
# difference is nil - both are at 99.9% - and where it exists is Linux, 93.9%
# ETC against 87.6% ASTC. `bc` is old by date and nowhere near legacy by use.
#
# Those are marginals, and what actually falls back is an intersection: a
# UASTC texture goes to pixels only where there is ETC and neither ASTC nor
# BC7. No survey reports that joint, so 6% of Linux is a ceiling on it and
# almost certainly well above the truth.
#
# Cargo features add, they do not subtract, so this cannot be a flag that
# default turns off. It is in default instead, and retiring the family means
# deleting the word from that line - one edit, in the place the reasoning for
# it is written. The CI slice that builds without it keeps that edit honest.
legacy = ["etc"]
