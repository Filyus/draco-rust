[package]
name = "draco-io"
version = "0.1.0"
edition = "2021"
description = "Rust IO helpers for Draco geometry compression formats"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
readme = "README.md"
keywords = ["draco", "gltf", "obj", "ply", "fbx"]
categories = ["compression", "encoding", "graphics", "parser-implementations"]
exclude = [
    "tests/cpp_decode_test.rs",
    "tests/encoding_speed_test.rs",
    "tests/glb_roundtrip_test.rs",
    "tests/gltf_compress_assets_test.rs",
    "tests/ply_bunny_test.rs",
    "tests/roundtrip.rs",
    "tools/blender_roundtrip.py",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
draco-core = { version = "1.0.0", path = "../draco-core", default-features = false }
thiserror = "2.0.17"
byteorder = { version = "1.5.0", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1.0.148", optional = true, default-features = false, features = ["alloc"] }
miniz_oxide = { version = "0.6", optional = true }

[features]
default = [
    "all-writers",
    "all-readers",
    "compression",
    "point_cloud_decode",
]
all-readers = ["fbx-reader", "gltf-reader", "obj-reader", "ply-reader"]
all-writers = ["fbx-writer", "gltf-writer", "obj-writer", "ply-writer"]
# Plain mesh formats (OBJ/PLY/FBX) only touch the geometry data model in
# draco-core, never the Draco codec, so they do not enable encoder/decoder.
# Only glTF uses KHR_draco_mesh_compression and thus pulls the codec.
fbx-reader = ["scene"]
fbx-writer = []
gltf-reader = ["draco-core/decoder", "scene", "dep:serde", "dep:serde_json"]
gltf-writer = [
    "draco-core/decoder",
    "draco-core/encoder",
    "scene",
    "dep:serde",
    "dep:serde_json",
    "serde/std",
    "serde_json/std",
]
# Optional compatibility mode for reading older Draco bitstreams embedded in
# KHR_draco_mesh_compression payloads. Writers still emit the current bitstream.
legacy-bitstream-decode = ["draco-core/legacy_bitstream_decode"]
obj-reader = []
obj-writer = []
ply-reader = ["dep:byteorder"]
ply-writer = []
# Scene-graph layer, only pulled in by formats that natively carry a hierarchy.
scene = []
point_cloud_decode = ["draco-core/point_cloud_decode"]
compression = ["miniz_oxide"]
# Repository-only fixtures and local external-tool tests.
test = []

[dev-dependencies]
tempfile = "3.24.0"

[[example]]
name = "check_dedup"
required-features = ["all-readers"]

[[example]]
name = "decode_drc"
required-features = ["all-readers"]

[[example]]
name = "decode_rust_lamp"
required-features = ["all-readers"]

[[example]]
name = "encode_lamp"
required-features = ["all-writers", "all-readers"]

[[example]]
name = "fbx_demo"
required-features = ["all-writers", "all-readers"]

[[example]]
name = "fbx_inspect"
required-features = ["fbx-reader"]

[[example]]
name = "gltf_demo"
required-features = ["gltf-writer", "gltf-reader"]

[[example]]
name = "polymorphic"
required-features = ["all-writers"]

[[example]]
name = "unified_api"
required-features = ["all-writers"]

[[example]]
name = "unified_readers"
required-features = ["all-writers", "all-readers"]

[[test]]
name = "api_alignment"
required-features = ["all-writers", "all-readers"]

[[test]]
name = "geometry_contract"
required-features = ["all-writers", "all-readers"]

[[test]]
name = "gltf_compress_fuzz_test"
required-features = ["gltf-writer", "gltf-reader"]

[[test]]
name = "gltf_compress_test"
required-features = ["gltf-writer", "gltf-reader"]
