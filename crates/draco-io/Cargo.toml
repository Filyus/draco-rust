[package]
name = "draco-io"
version = "0.3.1"
edition = "2021"
description = "Rust IO helpers for Draco geometry compression formats"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
readme = "README.md"
# Five is the crates.io maximum, so this is the family plus the four mesh
# formats read and written end to end. `gltf` came off rather than STL being
# left out: `draco-gltf` is the crate that owns glTF documents, and what this
# one does there is containers and accessors, so a search for glTF is better
# answered by that crate than by this.
keywords = ["draco", "obj", "ply", "stl", "fbx"]
categories = ["compression", "encoding", "graphics", "parser-implementations"]
exclude = [
    "tests/cpp_decode_test.rs",
    "tests/fbx_real_test.rs",
    "tests/ply_bunny_test.rs",
    "tools/blender_roundtrip.py",
]
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
draco-core = { version = "1.0.4", path = "../draco-core", default-features = false }
thiserror = "2.0.17"
byteorder = { version = "1.5.0", optional = true }
miniz_oxide = { version = "0.6", optional = true }

[features]
default = [
    "all-writers",
    "all-readers",
    "compression",
    "point_cloud_decode",
]
all-readers = ["fbx-reader", "obj-reader", "ply-reader", "stl-reader"]
all-writers = ["fbx-writer", "obj-writer", "ply-writer", "stl-writer"]
# Plain mesh formats (OBJ/PLY/FBX) only touch the geometry data model in
# draco-core, never the Draco codec, so they do not enable encoder/decoder.
# Only glTF uses KHR_draco_mesh_compression and thus pulls the codec.
fbx-reader = []
fbx-writer = []
gltf-container = []
gltf-geometry = ["gltf-container"]
# Decoder support is separate from the container/accessor contracts, so a
# compact glTF frontend can choose it without also enabling any encoder path.
draco-decode = ["gltf-geometry", "draco-core/decoder"]
# Optional compatibility mode for reading older Draco bitstreams embedded in
# KHR_draco_mesh_compression payloads. Writers still emit the current bitstream.
legacy-bitstream-decode = ["draco-core/legacy_bitstream_decode"]
obj-reader = []
obj-writer = []
ply-reader = ["dep:byteorder"]
ply-writer = []
stl-reader = []
stl-writer = []
point_cloud_decode = ["draco-core/point_cloud_decode"]
compression = ["miniz_oxide"]
# Repository-only fixtures and local external-tool tests.
test = []

[dev-dependencies]
tempfile = "3.24.0"
# `ply_bunny_test` encodes a mesh to verify the reader's output round-trips.
# The library itself never needs the Draco encoder, so it stays test-only.
draco-core = { version = "1.0.4", path = "../draco-core", features = ["encoder"] }

[[example]]
name = "decode_drc"
required-features = ["all-readers"]

[[example]]
name = "decode_rust_lamp"
required-features = ["all-readers"]

[[example]]
name = "fbx_demo"
required-features = ["all-writers", "all-readers"]

[[example]]
name = "fbx_inspect"
required-features = ["fbx-reader"]

[[example]]
name = "unified_readers"
required-features = ["all-writers", "all-readers"]

# `autotests = false` above means every integration test needs its own stanza.
# Without one the file is silently never compiled.
[[test]]
name = "fbx_real_test"
path = "tests/fbx_real_test.rs"
required-features = ["test"]

[[test]]
name = "fbx_corpus"
path = "tests/fbx_corpus.rs"
required-features = ["test", "fbx-reader", "compression"]

[[test]]
name = "cpp_decode_test"
path = "tests/cpp_decode_test.rs"
required-features = ["test", "point_cloud_decode"]

[[test]]
name = "ply_bunny_test"
path = "tests/ply_bunny_test.rs"
required-features = ["test", "ply-reader"]


[[example]]
name = "fbx_endian_diff"
required-features = ["fbx-reader", "compression"]

[[example]]
name = "fbx_sweep"
required-features = ["fbx-reader", "fbx-writer", "compression"]

[[example]]
name = "fbx_twin_diff"
required-features = ["fbx-reader", "compression"]

[[example]]
name = "fbx_make_seeds"
required-features = ["fbx-reader", "fbx-writer", "compression"]

[[example]]
name = "fbx_rewrite"
required-features = ["fbx-reader", "fbx-writer", "compression"]
