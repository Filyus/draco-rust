[package]
name = "draco-io"
version = "0.3.0"
edition = "2021"
description = "Rust IO helpers for Draco geometry compression formats"
license = "Apache-2.0"
repository = "https://github.com/Filyus/draco-rust"
readme = "README.md"
keywords = ["draco", "gltf", "obj", "ply", "fbx"]
categories = ["compression", "encoding", "graphics", "parser-implementations"]
exclude = [
    "tests/cpp_decode_test.rs",
    "tests/ply_bunny_test.rs",
    "tests/roundtrip.rs",
    "tools/blender_roundtrip.py",
]
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
draco-core = { version = "1.0.0", path = "../draco-core", default-features = false }
thiserror = "2.0.17"
byteorder = { version = "1.5.0", optional = true }
miniz_oxide = { version = "0.6", optional = true }

[features]
default = [
    "all-writers",
    "all-readers",
    "compression",
    "point_cloud_decode",
]
all-readers = ["fbx-reader", "obj-reader", "ply-reader"]
all-writers = ["fbx-writer", "obj-writer", "ply-writer"]
# Plain mesh formats (OBJ/PLY/FBX) only touch the geometry data model in
# draco-core, never the Draco codec, so they do not enable encoder/decoder.
# Only glTF uses KHR_draco_mesh_compression and thus pulls the codec.
fbx-reader = ["scene"]
fbx-writer = []
gltf = []
gltf-geometry = ["gltf"]
# Decoder support is separate from the container/accessor contracts, so a
# compact glTF frontend can choose it without also enabling any encoder path.
draco-decode = ["gltf-geometry", "draco-core/decoder"]
# Optional compatibility mode for reading older Draco bitstreams embedded in
# KHR_draco_mesh_compression payloads. Writers still emit the current bitstream.
legacy-bitstream-decode = ["draco-core/legacy_bitstream_decode"]
obj-reader = []
obj-writer = []
ply-reader = ["dep:byteorder"]
ply-writer = []
# Scene-graph layer, only pulled in by formats that natively carry a hierarchy.
scene = []
point_cloud_decode = ["draco-core/point_cloud_decode"]
compression = ["miniz_oxide"]
# Repository-only fixtures and local external-tool tests.
test = []

[dev-dependencies]
tempfile = "3.24.0"

[[example]]
name = "decode_drc"
required-features = ["all-readers"]

[[example]]
name = "decode_rust_lamp"
required-features = ["all-readers"]

[[example]]
name = "fbx_demo"
required-features = ["all-writers", "all-readers"]

[[example]]
name = "fbx_inspect"
required-features = ["fbx-reader"]

[[example]]
name = "unified_readers"
required-features = ["all-writers", "all-readers"]

