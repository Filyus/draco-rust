[workspace]
members = [
    "draco-core",
    "draco-io",
    "draco-gltf",
    "draco-texture",
    "draco-cpp-test-bridge",
]
resolver = "2"

# Optimize draco-core even in dev/test builds so benchmarks are meaningful.
[profile.dev.package.draco-core]
opt-level = 3
codegen-units = 1

[profile.test.package.draco-core]
opt-level = 3
codegen-units = 1

# The texture crate bakes its BC1 tables by exhaustive search, and a test
# reruns that search to prove the committed tables still match it. Unoptimized
# that is minutes rather than seconds.
[profile.dev.package.draco-texture]
opt-level = 3

[profile.test.package.draco-texture]
opt-level = 3

[profile.dev.package.draco-io]
opt-level = 2

[profile.test.package.draco-io]
opt-level = 2

# Also optimize the FFI test crate so the benchmark loops themselves are fast.
[profile.dev.package.draco-cpp-test-bridge]
opt-level = 2

[profile.test.package.draco-cpp-test-bridge]
opt-level = 2

# Note: LTO is intentionally NOT enabled for tests. `lto = "thin"` disables
# Rust incremental compilation, causing full rebuilds on every run (~3 minutes).
# Without LTO, incremental builds complete in ~15 seconds after the first build.

# Release builds one codegen unit per crate and links them with full LTO. The
# defaults (16 units, no LTO) split draco-core's own hot code across units and
# inhibit inlining inside it; both dials together are worth 2-5% of the decode
# and 3-7% of the encode against the C++ reference in the same run.
#
# The two are a pair and neither is optional. `codegen-units = 1` on its own
# costs ~5% on the speed-0 encode path, and full LTO is what pays that back --
# `lto = "thin"` leaves the regression standing. Anything measured under this
# profile has to be re-measured if either dial moves.
#
# This is the profile our binaries and benchmarks get; a consumer of the
# library picks their own.
[profile.release]
codegen-units = 1
lto = "fat"
