[package]
name = "draco-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
draco-core = { path = "../crates/draco-core", default-features = false, features = ["decoder", "point_cloud_decode", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
draco-gltf = { path = "../crates/draco-gltf" }
# The FBX reader parses untrusted binary with length-prefixed arrays and a
# decompression path, so it needs coverage-guided fuzzing as much as the Draco
# decoder does. `compression` is on because every real exporter emits zlib
# arrays; without it the inflate path would never be reached.
draco-io = { path = "../crates/draco-io", default-features = false, features = [
    "fbx-reader",
    "fbx-writer",
    "compression",
] }
# KTX2 is the other untrusted binary container the workspace reads: a header
# of file-controlled offsets and lengths, a Zstd payload that expands, and
# block data indexed from dimensions the file states. Every feature is on, so
# each transcode target is reachable.
draco-texture = { path = "../crates/draco-texture" }
libfuzzer-sys = "0.4"

[[bin]]
name = "decode_drc"
path = "fuzz_targets/decode_drc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress_gltf"
path = "fuzz_targets/compress_gltf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "draco_gltf_import"
path = "fuzz_targets/draco_gltf_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fbx_read_scene"
path = "fuzz_targets/fbx_read_scene.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fbx_roundtrip"
path = "fuzz_targets/fbx_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ktx2_transcode"
path = "fuzz_targets/ktx2_transcode.rs"
test = false
doc = false
bench = false

# Release-profile defaults, stated explicitly to document intent. NOTE: the
# actual switch for production (release) fuzzing semantics is the cargo-fuzz `-O`
# flag, not this profile — cargo-fuzz enables debug-assertions/overflow-checks by
# default and a profile setting does not override that. See FUZZING.md; CI and
# .clusterfuzzlite/build.sh both pass `-O` so the campaign targets shipped
# behavior (the decoder intentionally wraps like C++ and keeps DCHECK-equivalent
# debug_assert! invariants that are compiled out in release).
[profile.release]
debug-assertions = false
overflow-checks = false
