[package]
name = "draco-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
draco-core = { path = "../crates/draco-core", default-features = false, features = ["decoder", "point_cloud_decode", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
draco-io = { path = "../crates/draco-io", default-features = false, features = ["gltf-reader", "gltf-writer"] }
libfuzzer-sys = "0.4"

[[bin]]
name = "decode_drc"
path = "fuzz_targets/decode_drc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress_gltf"
path = "fuzz_targets/compress_gltf.rs"
test = false
doc = false
bench = false

# Release-profile defaults, stated explicitly to document intent. NOTE: the
# actual switch for production (release) fuzzing semantics is the cargo-fuzz `-O`
# flag, not this profile — cargo-fuzz enables debug-assertions/overflow-checks by
# default and a profile setting does not override that. See FUZZING.md; CI and
# .clusterfuzzlite/build.sh both pass `-O` so the campaign targets shipped
# behavior (the decoder intentionally wraps like C++ and keeps DCHECK-equivalent
# debug_assert! invariants that are compiled out in release).
[profile.release]
debug-assertions = false
overflow-checks = false
