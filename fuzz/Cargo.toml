[package]
name = "draco-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
draco-core = { path = "../crates/draco-core", default-features = false, features = ["decoder", "point_cloud_decode"] }
libfuzzer-sys = "0.4"

[[bin]]
name = "decode_drc"
path = "fuzz_targets/decode_drc.rs"
test = false
doc = false
bench = false

# Fuzz with production (release) semantics so the campaign targets the actual
# shipped behavior. The decoder intentionally relies on two's-complement wrapping
# (matching C++ Draco) and uses debug_assert!/DCHECK-equivalent invariants that
# are compiled out in release. With these on (cargo-fuzz's default) the fuzzer
# trips on those dev-time checks instead of real hostile-input hazards. Disabling
# them keeps memory-safety coverage intact — out-of-bounds indexing still panics
# in release Rust and is still caught — while removing benign debug-only noise.
[profile.release]
debug-assertions = false
overflow-checks = false
