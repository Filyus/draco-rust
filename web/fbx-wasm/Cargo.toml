[package]
name = "fbx-wasm"
version = "0.1.0"
edition = "2021"
description = "Draco web FBX reader and writer (WASM)"
repository = "https://github.com/Filyus/draco-rust"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
draco-core = { path = "../../crates/draco-core", default-features = false, optional = true }
draco-io = { path = "../../crates/draco-io", default-features = false, optional = true }

[features]
default = ["read", "write"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
# FBX binary reading (`parse_fbx`). The shared reader preserves the model tree
# and supported local transforms instead of exposing only a flat mesh list.
# `draco-io/compression` enables zlib inflation for FBX array payloads, which
# every real-world FBX exporter (Maya/Blender/MotionBuilder) emits; without it
# the reader fails with "FBX array compression not supported".
read = ["dep:draco-core", "dep:draco-io", "draco-io/fbx-reader", "draco-io/compression"]
# FBX binary writing (`create_fbx`).
write = ["dep:draco-core", "dep:draco-io", "draco-io/fbx-writer", "draco-io/compression"]
