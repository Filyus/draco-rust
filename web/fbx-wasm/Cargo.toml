[package]
name = "fbx-wasm"
version = "0.1.0"
edition = "2021"
description = "Draco web FBX reader and writer (WASM)"
repository = "https://github.com/Filyus/draco-rust"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
# FBX array zlib inflation, required only by the reader.
miniz_oxide = { version = "0.9.1", optional = true }

[features]
default = ["read", "write"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
# FBX binary reading (`parse_fbx`). Enables zlib-inflated array decoding.
read = ["dep:miniz_oxide"]
# FBX binary writing (`create_fbx`).
write = []
