[package]
name = "stl-wasm"
version = "0.1.0"
edition = "2021"
description = "Draco web STL reader and writer (WASM)"
repository = "https://github.com/Filyus/draco-rust"
license = "Apache-2.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wasm-bridge = { path = "../wasm-bridge" }
console_error_panic_hook = { workspace = true, optional = true }
draco-core = { path = "../../crates/draco-core", default-features = false, optional = true }
draco-io = { path = "../../crates/draco-io", default-features = false }

[features]
default = ["read", "write"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
# STL reading (`parse_stl_bytes`).
read = ["dep:draco-core", "draco-io/stl-reader"]
# STL writing (`create_stl`).
write = ["dep:draco-core", "draco-io/stl-writer"]
