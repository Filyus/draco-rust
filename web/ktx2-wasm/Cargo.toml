[package]
name = "ktx2-wasm"
version = "0.1.0"
edition = "2021"
description = "KTX2 reading and Basis Universal transcoding for WebAssembly"
repository = "https://github.com/Filyus/draco-rust"
license = "Apache-2.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
draco-texture = { path = "../../crates/draco-texture", default-features = false, features = [
    "etc1s",
    "uastc",
] }

[features]
# A browser can be any machine, so a module served to all of them carries
# every target. A deployment that knows its audience - a desktop tool, a
# kiosk - can drop a family and the tables that come with it; see the feature
# comments in `draco-texture`, which these forward to.
default = ["modern", "legacy"]
bc = ["draco-texture/bc"]
etc = ["draco-texture/etc"]
astc = ["draco-texture/astc"]
# See `draco-texture`. `modern` is what hardware sold today takes; `legacy` is
# what is carried only for machines with no current alternative, and serving
# the app drops it the day ETC-without-ASTC stops being something anyone opens
# a model on.
modern = ["bc", "astc"]
legacy = ["etc"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

