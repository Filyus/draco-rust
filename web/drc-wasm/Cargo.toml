[package]
name = "drc-wasm"
version = "0.1.0"
edition = "2021"
description = "Draco web .drc reader and writer (WASM)"
repository = "https://github.com/Filyus/draco-rust"
license = "Apache-2.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wasm-bridge = { path = "../wasm-bridge" }
console_error_panic_hook = { workspace = true, optional = true }
draco-core = { path = "../../crates/draco-core", default-features = false }

[features]
default = ["read", "write", "point-cloud-decode", "legacy-bitstream-decode"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
# Draco decoding (`parse_drc_bytes`) of the current-version meshes that
# KHR_draco_mesh_compression carries.
read = ["draco-core/decoder", "draco-core/edgebreaker_valence_decode"]
# Point clouds, splats among them.
point-cloud-decode = ["read", "draco-core/point_cloud_decode"]
# Bitstreams older than the current version.
legacy-bitstream-decode = ["read", "draco-core/legacy_bitstream_decode"]
# Draco encoding (`create_drc`).
write = ["draco-core/encoder", "draco-core/edgebreaker_valence_encode"]
