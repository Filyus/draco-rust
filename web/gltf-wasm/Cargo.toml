[package]
name = "gltf-wasm"
version = "0.1.0"
edition = "2021"
description = "glTF scene and geometry reading with optional writing for WebAssembly"
repository = "https://github.com/Filyus/draco-rust"
license = "Apache-2.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
draco-gltf = { path = "../../crates/draco-gltf", default-features = false, features = ["document", "resources", "scene-validation"] }
draco-io = { path = "../../crates/draco-io", default-features = false, features = ["gltf"] }

[features]
default = ["read", "draco-decode"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
read = ["draco-gltf/read"]
draco-decode = ["read", "draco-gltf/draco-decode"]
# Generic non-primitive accessor materialization for animation, skins, and morphs.
accessors = ["read", "draco-gltf/accessors"]
raw-resources = ["read"]
write = ["read", "draco-gltf/write"]
draco-encode = ["write", "draco-decode", "draco-gltf/draco-encode"]
