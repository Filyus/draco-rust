# Current actionable implementation status for the Rust codebase.
#
# Scope:
# - Keep only items that still need code changes.
# - Do not mirror implementation_state.yaml or list completed work.
# - Remove items as soon as they are fixed and covered by tests, then update implementation_state.yaml with the completed behavior.
# - Prefer concrete file/line evidence over broad percentages.
#
# Structure:
# items:
#   - id: stable-short-id
#     area: crate-or-module
#     priority: low|medium|high
#     status: open
#     summary: "One concrete implementation gap."
#     evidence:
#       - path: "relative/path.rs"
#         note: "Specific failing behavior, missing coverage, or source evidence."
#     impact: "Why this still matters."
#     next_steps:
#       - "Smallest useful implementation or investigation step."
#     refuted:
#       - "A claim this item used to make that measurement has since killed."
#
# `refuted` is optional and exists so an item that survives a measurement does
# not silently re-acquire the reading that measurement disproved. Put a claim
# there when the item stays open but its evidence, cause or size has changed;
# the numbers behind it belong in PERFORMANCE.md, and only the verdict here.
#
# An empty items list means there are currently no known actionable implementation
# gaps. Completed behavior and policy decisions belong in implementation_state.yaml.
# Malformed-input/resource-hardening status is tracked separately in
# hardening_status.yaml; keep only concrete implementation actions here.

version: 1
last_reviewed: "2026-09-01"

items:
  - id: pgo-two-pass-build
    area: draco-io
    priority: low
    status: open
    summary: "Profile-guided optimisation is documented and measured at 9-12% but has never been wired into a build."
    evidence:
      - path: "PGO.md"
        note: "Covers the two-pass build, how it relates to a source library rather than a shipped binary, training-corpus guidance and the WASM-target tradeoff. Nothing consumes it."
    impact: "Larger than any individual source change still on the table after profiling rounds 2-6, and the only remaining lever that is not a code change at all -- but it is a build-level decision: it needs a training corpus that represents real input, and it is a poor fit for the WASM target, so it is the maintainer's call rather than an edit."
    next_steps:
      - "Decide whether the benefit is claimed by this repo's own builds or only documented for downstream consumers -- the crates are published as source, so the win reaches users only if they opt in."
      - "If claimed here, pick the training corpus first: PGO trained on the wrong stream shape can lose, and the C++-default fixtures and this crate's own encodes profile differently."

  - id: decoder-buffer-reuse-across-decodes
    area: draco-core
    priority: low
    status: open
    summary: "Every decode builds a fresh Mesh, CornerTable and attribute buffers, so a caller decoding many files pays the setup each time."
    evidence:
      - path: "crates/draco-core/src/mesh_decoder.rs"
        note: "The entry point takes a &mut Mesh but the decode allocates its own corner table, index maps and per-attribute DataBuffers per call; nothing is retained between calls."
    impact: "Aimed at the repeated-decode caller -- a viewer or a server decoding many assets -- not at one-shot decode. A warm decode loop has to construct MeshDecoder::new() and Mesh::new() per iteration because that is the only shape the API offers, and the cold-vs-warm gap it reports (car.drc: 68 us cold against 3 us warm) is largely allocator state. It is an additive API change in the crate that owns the allocations, so draco-io and draco-gltf would benefit without owning any of it."
    next_steps:
      - "Measure first: profile what a second decode into an already-populated Mesh would actually skip, since the buffers are sized from each stream and may not be reusable in practice."
      - "If the win is real, add a reuse entry point rather than changing the existing one -- draco-core is published, so this must stay additive."


  - id: encode-setup-cost-on-small-meshes
    area: draco-core
    priority: medium
    status: open
    summary: "An encode allocates the same ~85 times whether the mesh has 8 faces or 19,602, so about 85% of a tiny encode is per-call cost that no per-face work can reach."
    evidence:
      - path: "PERFORMANCE.md"
        note: "\"The Small-Mesh Encode Cost, Reproduced Against Its Own Hypothesis\". Allocations per encode at speed 5: 85 on an 8-face mesh, 86 on a 19,602-face one. An 8-face encode costs 4.9 us against the 0.093 us/face the large mesh pays, so 0.75 us of it is its faces."
      - path: "crates/draco-core/src/mesh_encoder.rs"
        note: "`encode` opens with `self.options = options.clone()`, which copies two HashMaps of String keys -- 6 allocations for keys that are string literals at every call site here. The rest of the fixed count is edgebreaker-encoder setup (~23 of the first 64 sampled), encode_edgebreaker_attributes_split (9) and CornerTable::init (11)."
    impact: "Encode only; decode has its own item. It matters for the caller encoding many small meshes -- a glTF with hundreds of tiny primitives pays this per primitive -- and not at all for one large mesh."
    next_steps:
      - "Name the whole fixed count, not the first 64: encode_matrix's SAMPLE_LIMIT is not env-controlled, so raise it alongside SAMPLE_ALLOC_MIN/MAX before sampling a payload that allocates more than that."
      - "Take the cheapest block first and measure it alone: the options clone is 6 allocations of pure bookkeeping, and interning the keys keeps EncoderOptions' fields private and the API additive."
      - "Measure on a mesh small enough for the floor to show -- an 18k-face payload dilutes a 4 us effect to 0.2%, and the seeded sweep is the control the change must not cost anything on."
    refuted:
      - "That the 2.0 series (7a277ff..f18f3e1) left small-mesh encode 3-13% slower. Measured payload by payload with the release profile matched across revisions: 3.6% at 8 faces at speed 5 (7/7 rounds) and nothing resolvable at 12 faces or above, with the series a 14-15% win at speed 1 from 170 faces up."
      - "That the memoisation commits are the cause. The series changed the allocation count by zero on every speed-5 cell measured; the entropy cache grows lazily from empty and the geometric-normal caches need a normal attribute the 8-face payload does not have. A face-count gate would have had no setup to skip."
      - "That any of it stands today. 4353e7a is faster than 7a277ff on every payload and speed measured, 0/7 signs throughout -- 0.85x on the 8-face mesh, 0.68-0.72x on the 18k one."
