# Current actionable implementation status for the Rust codebase.
#
# Scope:
# - Keep only items that still need code changes.
# - Do not mirror implementation_state.yaml or list completed work.
# - Remove items as soon as they are fixed and covered by tests, then update implementation_state.yaml with the completed behavior.
# - Prefer concrete file/line evidence over broad percentages.
#
# Structure:
# items:
#   - id: stable-short-id
#     area: crate-or-module
#     priority: low|medium|high
#     status: open
#     summary: "One concrete implementation gap."
#     evidence:
#       - path: "relative/path.rs"
#         note: "Specific failing behavior, missing coverage, or source evidence."
#     impact: "Why this still matters."
#     next_steps:
#       - "Smallest useful implementation or investigation step."
#
# An empty items list means there are currently no known actionable implementation
# gaps. Completed behavior and policy decisions belong in implementation_state.yaml.
# Malformed-input/resource-hardening status is tracked separately in
# hardening_status.yaml; keep only concrete implementation actions here.

version: 1
last_reviewed: "2026-07-26"

items:
  - id: fbx-pre-7000-object-model
    area: draco-io/fbx
    priority: low
    status: open
    summary: "FBX 6100 and earlier decode to an empty scene: 81 of the 308 binary corpus files, plus 118 ASCII ones."
    evidence:
      - path: "crates/draco-io/src/fbx_reader.rs"
        note: "FbxObjectIndex::build indexes objects by i64 id. Pre-7000 identifies them by a name string ending in a class marker and connects them by that string, so nothing is indexed; the reader reports FbxWarningCode::NameKeyedObjectModel rather than failing."
      - path: "crates/draco-io/README.md"
        note: "The container/content split is documented: the container is read for 6000-8000, scene content only for 7000 and later."
    impact: "A quarter of the corpus, and any older asset, decodes to nothing. Deliberately deferred: this is a parallel object-identity layer, comparable in size to the ASCII container work, not a patch."
    next_steps:
      - "Synthesize stable ids from the name+class strings and resolve Connect records against them."
      - "Treat Objects/Model as its own geometry source, since pre-7000 has no separate Geometry object."
      - "Add a scalar-property fallback wherever an array property is read: 6100 stores arrays as repeated scalar properties."

  - id: fbx-unconnected-models-become-scene-objects
    area: draco-io/fbx
    priority: low
    status: open
    summary: "A Model with no OO connection to the root is read as a root node, so objects the source kept out of the scene graph reappear in a rewrite."
    evidence:
      - path: "crates/draco-io/src/fbx_reader.rs"
        note: "MotionBuilder's seven Producer viewport cameras are connected only by OP ... CurrentCamera, never OO ... 0. Blender skips them; this reader roots them, and the writer then emits them as real scene objects. Four corpus files: motionbuilder_cube, _sausage_rrss, _smoothing, _thumbnail each gain seven cameras plus a Camera Switcher."
      - path: "crates/draco-io/tests/fbx_corpus.rs"
        note: "Invisible to the round-trip check, which compares our own read of both files and so agrees with itself. Found by importing before and after into Blender 4.5."
    impact: "Cosmetic today -- the objects were already emitted as empties before cameras were written, so this is not a regression -- but a rewrite of a MotionBuilder file gains eight objects its author excluded."
    next_steps:
      - "Establish why unconnected Models are rooted: if it is to recover geometry from files with sloppy connections, find one and keep it working before changing anything."
      - "If nothing depends on it, drop Models that reach neither the root nor a rooted parent, and report the count as a warning rather than silently."

  - id: fbx-written-skeleton-is-not-an-armature
    area: draco-io/fbx
    priority: low
    status: open
    summary: "A rewritten skinned document loses its armature: Blender rebuilds the joints as empties instead of bones."
    evidence:
      - path: "crates/draco-io/src/fbx_writer.rs"
        note: "blender_293_barbarian_7400_binary imports into Blender 5.0's ufbx importer with no empties; the same scene written back yields eleven, named after the joints with an _end suffix, which is what Blender creates when it cannot form a bone chain."
      - path: "crates/draco-io/examples/fbx_rewrite.rs"
        note: "Predates the property-template work -- the rewrite produced the same eleven before it -- so it belongs to how the skeleton is written, not to how properties are read."
    impact: "A skinned FBX survives our own round trip but arrives in Blender without an armature, so it cannot be posed."
    next_steps:
      - "Compare the written NodeAttribute/Skeleton and its Model chain against the source: Size, LimbLength and the parent connections are the usual reasons a chain does not form."

  - id: fbx-ascii-writer
    area: draco-io/fbx
    priority: low
    status: open
    summary: "ASCII FBX is read but not written. The blocker is gone; what remains is a printer, and a decision about whether it is wanted."
    evidence:
      - path: "crates/draco-io/src/fbx_writer.rs"
        note: "FbxWriter::build_document returns Vec<FbxNode> and knows nothing about bytes. fbx_encoder::encode_node is the only thing that spells a record, so a second backend is a second printer over the same tree rather than a second document builder."
      - path: "crates/draco-io/src/fbx_ascii_syntax.rs"
        note: "The direction-independent conventions are extracted and the writer's obligations are enumerated in the module doc, including the one that cannot be met: the &quot; escape is not reversible, so a document with an object named `\"` cannot survive an ASCII round trip in either direction."
    impact: "Low. Round-tripping our own output is a weaker check than the 110 externally-authored ascii/binary pairs the reader is already validated against, and it cannot be exact. The real argument for ASCII output is diffability, not testing."
    next_steps:
      - "Decide whether readable FBX output is wanted at all before writing it; nothing currently needs it."
      - "If so: an ASCII printer over Vec<FbxNode>, honouring the obligations listed in fbx_ascii_syntax -- F64 printed with a decimal point or exponent, -0.0 kept signed, KeyAttrDataFloat printed as integer bit patterns, arrays shaped `Name: *N { a: v,v,v }`, Content as base64."
