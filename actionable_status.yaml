# Current actionable implementation status for the Rust codebase.
#
# Scope:
# - Keep only items that still need code changes.
# - Do not mirror implementation_state.yaml or list completed work.
# - Remove items as soon as they are fixed and covered by tests, then update implementation_state.yaml with the completed behavior.
# - Prefer concrete file/line evidence over broad percentages.
#
# Structure:
# items:
#   - id: stable-short-id
#     area: crate-or-module
#     priority: low|medium|high
#     status: open
#     summary: "One concrete implementation gap."
#     evidence:
#       - path: "relative/path.rs"
#         note: "Specific failing behavior, missing coverage, or source evidence."
#     impact: "Why this still matters."
#     next_steps:
#       - "Smallest useful implementation or investigation step."
#     refuted:
#       - "A claim this item used to make that measurement has since killed."
#
# `refuted` is optional and exists so an item that survives a measurement does
# not silently re-acquire the reading that measurement disproved. Put a claim
# there when the item stays open but its evidence, cause or size has changed;
# the numbers behind it belong in PERFORMANCE-LOG.md, and only the verdict here.
#
# An empty items list means there are currently no known actionable implementation
# gaps. Completed behavior and policy decisions belong in implementation_state.yaml.
# Malformed-input/resource-hardening status is tracked separately in
# hardening_status.yaml; keep only concrete implementation actions here.

version: 1
last_reviewed: "2026-09-04"

# `pgo-two-pass-build` was here and is closed rather than fixed. It asked
# whether the documented 9-12% should be claimed by this repository's own
# builds; the answer is measured and recorded in PGO.md, under "Measured here:
# nothing, for 2.8% of the download" -- PGO is wireable to WASM (train
# natively, spend the profile with -Cprofile-use, which needs no runtime) and
# on top of the opt-level the same round took it adds nothing. Nothing here
# needs a code change, which is the bar this file keeps.
#
# `encode-setup-cost-on-small-meshes` was here and is closed. Its one named
# block that was pure bookkeeping -- the `EncoderOptions` clone at the top of
# every encode, six allocations of map tables and String keys -- is gone: the
# maps sit behind an `Arc` and the clone is a reference count. Counted per
# encode at speed 5: 84 -> 79 allocations on the 8-face mesh, 147 -> 144 on the
# 12-face one, the sizes identical. The rest of the per-call floor is named in
# full in PERFORMANCE-LOG.md ("The Per-Call Floor, Named In Full") and has no
# dominant block -- the largest is 14 of 84, a long tail of 8-32 byte Vecs, one
# per attribute, component or traversal -- so nothing left there is an
# implementation gap this file's bar admits.
#
# `decoder-buffer-reuse-across-decodes` was here and is closed by the change it
# named as the one shape that could pay: `PointCloud::clear` now keeps the
# dropped attributes' value storage and explicit maps, emptied, and hands them
# to the attributes the next decode adds. Clocked against reuse without it in
# one binary, seven interleaved rounds (PERFORMANCE-LOG.md, "The Attribute
# Storage, Kept -- And It Pays"): 0.955x on the 8-face mesh, 0.961x at 12,
# 0.953x on the 18k-face grid and 0.979x on the small round-robin mix, each
# 7/7 signs, and every other cell leaning the same way. The staleness risk the
# item priced is absent by construction: the storage is handed over empty and
# every resize zero-fills, so a reused attribute reads what a fresh one reads.

items: []
