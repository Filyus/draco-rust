# Current actionable implementation status for the Rust codebase.
#
# Scope:
# - Keep only items that still need code changes.
# - Do not mirror implementation_state.yaml or list completed work.
# - Remove items as soon as they are fixed and covered by tests, then update implementation_state.yaml with the completed behavior.
# - Prefer concrete file/line evidence over broad percentages.
#
# Structure:
# items:
#   - id: stable-short-id
#     area: crate-or-module
#     priority: low|medium|high
#     status: open
#     summary: "One concrete implementation gap."
#     evidence:
#       - path: "relative/path.rs"
#         note: "Specific failing behavior, missing coverage, or source evidence."
#     impact: "Why this still matters."
#     next_steps:
#       - "Smallest useful implementation or investigation step."
#
# An empty items list means there are currently no known actionable implementation
# gaps. Completed behavior and policy decisions belong in implementation_state.yaml.
# Malformed-input/resource-hardening status is tracked separately in
# hardening_status.yaml; keep only concrete implementation actions here.

version: 1
last_reviewed: "2026-07-26"

items:
  - id: fbx-pre-7000-object-model
    area: draco-io/fbx
    priority: low
    status: open
    summary: "FBX 6100 and earlier decode to an empty scene: 81 of the 308 binary corpus files, plus 118 ASCII ones."
    evidence:
      - path: "crates/draco-io/src/fbx_reader.rs"
        note: "FbxObjectIndex::build indexes objects by i64 id. Pre-7000 identifies them by a name string ending in a class marker and connects them by that string, so nothing is indexed; the reader reports FbxWarningCode::NameKeyedObjectModel rather than failing."
      - path: "crates/draco-io/README.md"
        note: "The container/content split is documented: the container is read for 6000-8000, scene content only for 7000 and later."
    impact: "A quarter of the corpus, and any older asset, decodes to nothing. Deliberately deferred: this is a parallel object-identity layer, comparable in size to the ASCII container work, not a patch."
    next_steps:
      - "Synthesize stable ids from the name+class strings and resolve Connect records against them."
      - "Treat Objects/Model as its own geometry source, since pre-7000 has no separate Geometry object."
      - "Add a scalar-property fallback wherever an array property is read: 6100 stores arrays as repeated scalar properties."

  - id: fbx-camera-light-write
    area: draco-io/fbx
    priority: low
    status: open
    summary: "Cameras and lights are read but never written, so they are lost by an FBX-to-FBX rewrite."
    evidence:
      - path: "crates/draco-io/src/fbx_writer.rs"
        note: "The writer emits no NodeAttribute objects other than the skeleton attribute for limb nodes."
      - path: "crates/draco-io/tests/fbx_corpus.rs"
        note: "cameras_and_lights_are_read_but_not_written_back asserts the loss from both sides, so implementing the write makes that test fail and name the summary that must start comparing attributes."
    impact: "58 attributes across 20 corpus files. Read-only was the agreed scope, so this is a known boundary rather than a regression."
    next_steps:
      - "Emit Objects/NodeAttribute with the camera or light Properties70 and connect it to its Model."
      - "Add attribute comparison to SceneSummary and delete the characterization test."

  - id: fbx-ascii-writer-needs-a-node-tree
    area: draco-io/fbx
    priority: low
    status: open
    summary: "An ASCII FBX writer is blocked by the binary writer having no FbxNode-tree intermediate to share."
    evidence:
      - path: "crates/draco-io/src/fbx_writer.rs"
        note: "The writer never builds an FbxNode. Document-structure knowledge -- which objects exist, in what order, with which Properties70 and connections -- is fused into ~35 write_* free functions that each call the byte-level NodeWriter inline. There is no write_node(&FbxNode) to swap a backend under."
      - path: "crates/draco-io/src/fbx_ascii.rs"
        note: "The reader made the symmetric commitment and it held: it emits Vec<FbxNode> and the whole scene layer consumed it unchanged. The writer never made that commitment."
      - path: "crates/draco-io/src/fbx_ascii_syntax.rs"
        note: "The direction-independent conventions are already extracted and their writer-side obligations documented, so the remaining cost is entirely the intermediate representation."
    impact: "Without it an ASCII writer must duplicate the document structure, which is exactly the drift the shared node tree was adopted to prevent."
    next_steps:
      - "Preferred: rewrite the write_* family to build Vec<FbxNode>, then make binary encoding one backend over that tree and ASCII a second. Also gives the binary writer a far cheaper assertion surface than byte comparison."
      - "Cheaper but worse: abstract NodeWriter behind a trait. Blocked by finish_with_children needing Seek to backpatch offsets, and by the `*N { a: ... }` array shape being structural rather than per-property."
