# Current actionable implementation status for the Rust codebase.
#
# Scope:
# - Keep only items that still need code changes.
# - Do not mirror implementation_state.yaml or list completed work.
# - Remove items as soon as they are fixed and covered by tests, then update implementation_state.yaml with the completed behavior.
# - Prefer concrete file/line evidence over broad percentages.
#
# Structure:
# items:
#   - id: stable-short-id
#     area: crate-or-module
#     priority: low|medium|high
#     status: open
#     summary: "One concrete implementation gap."
#     evidence:
#       - path: "relative/path.rs"
#         note: "Specific failing behavior, missing coverage, or source evidence."
#     impact: "Why this still matters."
#     next_steps:
#       - "Smallest useful implementation or investigation step."
#
# An empty items list means there are currently no known actionable implementation
# gaps. Completed behavior and policy decisions belong in implementation_state.yaml.
# Malformed-input/resource-hardening status is tracked separately in
# hardening_status.yaml; keep only concrete implementation actions here.

version: 1
last_reviewed: "2026-08-27"

items:
  - id: pgo-two-pass-build
    area: draco-io
    priority: low
    status: open
    summary: "Profile-guided optimisation is documented and measured at 9-12% but has never been wired into a build."
    evidence:
      - path: "PGO.md"
        note: "Covers the two-pass build, how it relates to a source library rather than a shipped binary, training-corpus guidance and the WASM-target tradeoff. Nothing consumes it."
      - path: "dev/profiling/README.md"
        note: "Named as the largest single remaining lever after rounds 2-6, and the only one left that is not a code change."
    impact: "Larger than any individual source change still on the table, but it is a build-level decision: it needs a training corpus that represents real input, and it is a poor fit for the WASM target, so it is the maintainer's call rather than an edit."
    next_steps:
      - "Decide whether the benefit is claimed by this repo's own builds or only documented for downstream consumers -- the crates are published as source, so the win reaches users only if they opt in."
      - "If claimed here, pick the training corpus first: PGO trained on the wrong stream shape can lose, and the C++-default fixtures and this crate's own encodes profile differently."

  - id: decoder-buffer-reuse-across-decodes
    area: draco-core
    priority: low
    status: open
    summary: "Every decode builds a fresh Mesh, CornerTable and attribute buffers, so a caller decoding many files pays the setup each time."
    evidence:
      - path: "crates/draco-core/src/mesh_decoder.rs"
        note: "The entry point takes a &mut Mesh but the decode allocates its own corner table, index maps and per-attribute DataBuffers per call; nothing is retained between calls."
      - path: "dev/profiling/bench-profile/src/bin/drc_bench.rs"
        note: "The warm loop constructs MeshDecoder::new() and Mesh::new() per iteration because that is the only shape the API offers, and the cold-vs-warm gap it reports (car.drc: 68 us cold against 3 us warm) is largely allocator state."
    impact: "Aimed at the repeated-decode caller -- a viewer or a server decoding many assets -- not at one-shot decode. It is an additive API change in the crate that owns the allocations, so draco-io and draco-gltf would benefit without owning any of it."
    next_steps:
      - "Measure first: profile what a second decode into an already-populated Mesh would actually skip, since the buffers are sized from each stream and may not be reusable in practice."
      - "If the win is real, add a reuse entry point rather than changing the existing one -- draco-core is published, so this must stay additive."


  - id: encode-setup-cost-on-small-meshes
    area: draco-core
    priority: medium
    status: open
    summary: "The 2.0 optimization series is 1-11% faster encoding an 18k-face mesh and 3-13% slower encoding the real corpus, whose meshes are mostly under 170 faces."
    evidence:
      - path: "PERFORMANCE.md"
        note: "Paired A/B of 7a277ff against f18f3e1, both built with one toolchain, interleaved, each binary carrying the unchanged C++ side as a same-run control that agrees to 0.9%. Seeded sweep: newer faster in all 88 comparisons. Real corpus: newer faster in 11/55 encode comparisons and 41/55 decode ones."
      - path: "crates/draco-core/src/shannon_entropy.rs"
        note: "The memoisation commits (f9a331d entropy, c806dcd/c8e1be6 geometric normal positions, e568bb6 which recorded the memo's memory bound) all trade setup for per-element work, which is the shape that inverts when the element count is small. Named as the hypothesis to test first, not as a measured cause."
    impact: "Decode is unaffected -- it improved on both profiles. This is encode only, and it matters for the caller encoding many small meshes: a glTF with hundreds of tiny primitives pays the setup per primitive."
    next_steps:
      - "Measure the memo allocations directly on an 8-face and a 170-face encode rather than inferring them from the two profiles."
      - "If setup is the cause, gate the memo on a point or face count threshold and re-run both profiles -- the seeded sweep is the control that the gate must not cost anything on."
