        tests:
          - "oversized_edgebreaker_counts_fail_before_large_allocation"
    note: "EdgeBreaker connectivity decode now mirrors the C++ MeshEdgebreakerDecoderImpl geometric count invariants (num_faces <= u32::MAX/3, num_encoded_vertices <= 3*num_faces, vertex/face edge feasibility, num_symbols <= num_faces <= num_symbols*4/3, num_split_symbols <= num_symbols) BEFORE allocating face/connectivity storage, and the face vector, corner table, and per-vertex hole table use fallible try_reserve constructors (Mesh::try_set_num_faces, CornerTable::try_new, EdgebreakerConnectivityDecoder::try_new). Speculative event/symbol Vec pre-reservations are capped by the remaining byte/bit budget. Found by the decode_drc fuzz target (multi-GB allocation from a 115-byte input)."

  - id: point-cloud-count-amplification-bound
    status: covered
    evidence:
      - path: "crates/draco-core/src/point_cloud_decoder.rs"
    note: "Point-cloud decode rejects a declared point count beyond the remaining bit budget (>= 1 bit/point holds for every real Draco stream including KD-tree) before per-attribute buffers sized by num_points are allocated. Prevents memory amplification from a tiny malformed header in both the sequential and KD-tree attribute paths. Found by the decode_drc fuzz target (~4 GB allocation in KdTreeAttributesDecoder from a 115-byte input)."

  - id: sequential-mesh-count-amplification-bound
    status: covered
    evidence:
