          - "a_read_past_the_last_bit_is_not_a_zero_bit"
    note: "Direct bit decode rejects invalid requested bit counts and missing continuation words instead of assert/index panics. decode_next_bit returns Option<bool> rather than bool: its bits are a Vec<u32> filled by start_decoding, so a read past the end is exactly knowable, where before it was a zero bit indistinguishable from an encoded one - and the KD-tree loops that drive these reads take their counts from the same stream. Its rANS siblings cannot answer the same question; see rans-over-read-call-site-bounds."

