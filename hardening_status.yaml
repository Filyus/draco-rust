    evidence:
      - path: "fuzz/fuzz_targets/compress_gltf.rs"
      - path: "crates/draco-gltf/src/document_tests.rs"
    note: "The shared container and geometry layers perform checked GLB parsing/building, strict data-URI decoding, fallible bounded buffer reads, accessor-contract validation, and explicit resource resolution through ImportOptions. ExternalFilePolicy can deny access, allow it, or confine it to the base directory; optional per-resource, aggregate-buffer, and asset-chain quotas bound resource use. Deterministic regressions cover sparse accessors, KHR unique IDs, scene/animation/skin references, explicit files cycles, and atomic decompression. Both glTF libFuzzer targets are seeded and run in CI/ClusterFuzzLite."

