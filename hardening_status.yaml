      - path: "crates/draco-core/tests/drc_edge_cases_test.rs"
        tests:
          - "oversized_texcoord_orientations_decode_quickly_without_hang"
    note: "PredictionSchemeTexCoordsPortableDecoder::decode_prediction_data rejects a declared orientation count above the entry count before reserving and rANS-bit-decoding each orientation in a loop. C++ Draco checks only num_orientations < 0; the raw i32 count (up to ~2.1 billion) otherwise drove a ~2 second decode and multi-GB reservation. Found by the decode_drc fuzz target as a slow-unit/timeout from a 224-byte EdgeBreaker mesh input that reconstructs only 12 faces. The bound is structural: compute_original_values pops exactly one orientation per predicted entry, so a count above that can never be consumed whatever the stream holds. The first version bounded by remaining_size*8 instead, which carries the same false one-bit-per-item premise as the header count guards - a run of identical orientations compresses to far less than a bit each."

  - id: edgebreaker-traversal-corner-table-consistency
