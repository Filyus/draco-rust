  - id: ktx2-differential-against-the-reference
    status: covered
    evidence:
      - path: "web/tests/ktx2-differential.mjs"
      - path: "crates/draco-texture/src/ktx2.rs"
      - path: "crates/draco-texture/tests/ktx2_container.rs"
    note: "2400 mutants of the six seeds are fed to both this reader and Binomial's, and every image both accept must be byte-identical: 2505 images are, over four targets. It found a real defect on its first run -- the key/value section's range was never checked, so a file whose section ran past the end of the file was read as if it had none, which the reference refuses; the two then disagreed about the pixels of a file neither should have read. Fixed, with a regression test. Two things are deliberately out of scope and stated in the gate: the key/value section itself, because this reader reports it while the reference acts on it, so a garbled one leaves both right and different; and acceptance, which diverges by design and is tallied against a ceiling rather than asserted -- measured at 6 mutants only this reader read and 174 only the reference did. One more finding is about the oracle rather than this reader: fed malformed input, Binomial's module can return success from transcodeImage having written nothing, so the pristine seed is transcoded again after every mutant and a comparison from a degraded instance is discarded rather than believed."

  - id: ktx2-fuzzing-throughput
    status: covered
    evidence:
      - path: "crates/draco-texture/examples/ktx2_make_seeds.rs"
      - path: "crates/draco-texture/tests/ktx2_seeds.rs"
      - path: "fuzz/fuzz_targets/ktx2_transcode.rs"
    note: "The target first ran at 4 executions per second, because every seed was a full 512x512 or 1024x1024 texture decoded into seven formats across every mip level. Two changes, both measured: the decode bound is per level rather than per file, so a large fixture still has its small mips decoded and its supercompression and codebooks still read; and six seeds of 8 and 64 texels are generated by rebuilding fixtures around their smallest level, with the Zstd undone so that mutations land on block bits rather than dying in a frame checksum. Result: 64 executions per second at 4887 edges and 16726 features, against 4 per second at 5048 edges and 15524 features before -- sixteen times the rate and more features than the slow configuration reached. A 300-second campaign over the seeded corpus (ASan, release semantics) completed with no crash, no OOM and no timeout: 13521 executions, 5149 edges, 20474 features, peak RSS 510 MB. ktx2_seeds.rs asserts every seed still parses and decodes, since a seed that does not leaves the corpus looking stocked and the engine starting from nothing."

  - id: ktx2-reader-hardening
    status: covered
    evidence:
      - path: "crates/draco-texture/src/ktx2.rs"
      - path: "crates/draco-texture/tests/ktx2_container.rs"
      - path: "crates/draco-texture/tests/ktx2_malformed.rs"
      - path: "fuzz/fuzz_targets/ktx2_transcode.rs"
    note: "Offsets and lengths are checked as fits-in-what-is-left rather than as offset plus length, which wraps and passes. Dimensions are bounded at 16384 either way, without which every buffer sized as width by height wraps at 32 bits on the wasm32 target this ships to. A Zstd level's declared uncompressed length is bounded by what a level of those dimensions could hold, because it is what the output buffer is reserved from before anything is decompressed. Level and layer counts are bounded, and the ETC1S global data offsets are accumulated with checked addition and validated before the descriptor array is built. Six regression tests pin the individual cases, four sweeps cover every header field at eight extreme values, every truncation of every fixture and wholesale payload corruption, and a libFuzzer target parses arbitrary bytes and transcodes every level into every target. The two dimension and level-length bounds were added after auditing six 2026 hardening commits to the reference reader; the other four cases they cover were already handled."

  - id: encode-input-validation
    status: covered
    evidence:
      - path: "fuzz/fuzz_targets/encode_drc.rs"
      - path: "crates/draco-core/tests/encoder_hardening_test.rs"
      - path: "crates/draco-core/src/point_cloud_encoder.rs"
      - path: "crates/draco-core/src/mesh_encoder.rs"
      - path: "crates/draco-core/src/version.rs"
      - path: "crates/draco-core/src/attribute_quantization_transform.rs"
    note: "The encoders validate caller-supplied geometry once, before any encoder path derives a stride, a dimension or an offset from it: attributes must have components, a valid data type, a point map that lands inside their own value array, a stride at least as wide as their element, and a buffer long enough for the values they report; mesh faces must reference points the mesh has; the target bitstream version must be one the crate writes; the legacy predictive traversal is refused above 2.0; a mesh needing more attribute groups than the one-byte count field holds is refused rather than truncated; and a tex-coord prediction scheme forced onto a non-texcoord attribute is refused, because both tex-coord predictors take two components and a normal presents two after the octahedron transform, so the scheme was accepted for normals and wrote values the normal decoder cannot read. The buffer-length and stride checks close the case the mapping check cannot see - every index is in range while the bytes behind it are not - which reached the unchecked DataBuffer::read in the integer and KD-tree attribute readers. An encoder is also reset between encodes: each encode caches connectivity for the attribute stage, the sequential path does not rebuild all of it, and a reused encoder inherited the previous mesh's corner table and emitted a stream its own decoder rejects. The quantization transform and its parameter scan return a failure instead of indexing when a source offset falls outside the buffer, matching the octahedron counterpart. Found by the encode_drc libFuzzer target and by an audit of its first fixes; all cases are pinned in encoder_hardening_test.rs."

  - id: encode-side-resource-bounds
    status: covered
    evidence:
      - path: "crates/draco-core/src/shannon_entropy.rs"
      - path: "crates/draco-core/src/sequential_integer_attribute_encoder.rs"
      - path: "crates/draco-core/src/kd_tree_attributes_encoder.rs"
    note: "The prediction scorer's frequency table is indexed by symbol value, so its cost was the residual's magnitude rather than any count a caller declares - nothing validation can bound. A 100-point mesh at -qp 30 -cl 10, both legitimate settings, asked for a 17 GB table and took 13 seconds where the same mesh at -qp 24 took 40 ms. Symbols above 2^18 now live in a map whose cost is the number of distinct symbols, so the frequencies and therefore every prediction chosen from them are unchanged - byte-exact output, 13 seconds down to zero. Separately, the two `10 - speed` compression-level computations saturate and the KD-tree signed-to-unsigned conversion wraps explicitly: the speed is a caller-set option with no declared range, and the conversion is exact under two's complement, so both only differed by panicking in a debug build."

  - id: mesh-writer-attribute-types
    status: covered
    evidence:
      - path: "crates/draco-io/src/ply_writer.rs"
      - path: "crates/draco-io/src/stl_writer.rs"
      - path: "crates/draco-io/tests/writer_hardening_test.rs"
    note: "The PLY writer also flattens every mesh added to it into shared per-vertex lists and emits a property only while its list matches the vertex count. Those lists were padded before a mesh's values were appended but not after, so adding a mesh without normals dropped the normals of every mesh before it - the same two meshes wrote different files depending on the order. The other writers do not share the shape: OBJ expresses a missing attribute per face reference, STL has no per-vertex attributes, and the FBX writer keeps each mesh's attributes separately. A .drc declares its own attribute data types and component counts, so MeshDecoder hands back Uint8x3 positions or Int16x3 normals as readily as Float32x3 ones. The PLY and STL writers sliced a fixed twelve bytes at point * byte_stride through the panicking DataBuffer::read, so the decode-then-write pipeline this crate exists for panicked on such a mesh; the OBJ writer already refused it, which is what showed the guard had been written once and not carried across. The STL writer now refuses what it cannot read, as OBJ does, and the PLY writer converts each component at its own width through a bounds-checked reader. The PLY padding also measured how far behind the position list the other lists were, which underflowed for a mesh carrying normals but no positions."

  - id: ply-reader-header-counts
    status: covered
    evidence:
      - path: "crates/draco-io/src/ply_reader.rs"
      - path: "crates/draco-io/tests/reader_hardening_test.rs"
    note: "PLY is a header of declared element counts followed by a body, and the counts are unrelated to what follows. The ASCII line loops ran the declared count rather than the text, and the vertex and face vectors were reserved from the declared count before the body was read: a 169-byte file declaring four billion faces spun for seven seconds and requested 48 GB. The loops now end with the text and every reservation is bounded by what the remaining body could hold, which leaves a well-formed file reserving exactly its own count. Separately, a header naming more colour properties than a colour has channels indexed past the four-slot array; the extra channels are now read and dropped. Pinned by three regressions, one of which counts allocated bytes rather than timing the read, because reserving address space is invisible to a clock. The OBJ and STL readers are now fuzzed too - see mesh-text-readers-fuzzed."

  - id: mesh-text-readers-fuzzed
    status: covered
    evidence:
      - path: "fuzz/fuzz_targets/mesh_text_readers.rs"
      - path: "crates/draco-io/src/obj_reader.rs"
      - path: "crates/draco-io/tests/reader_hardening_test.rs"
    note: "The OBJ, PLY and STL readers were the workspace's only untrusted parsers with no coverage-guided fuzzing; one target now feeds every input to all three, seeded from the 74 committed mesh fixtures, and runs in CI and ClusterFuzzLite beside the others. Its first 300-second campaign completed clean: 239,722 executions, 1945 edges, no panic, OOM or timeout. The OBJ reader's two audit findings are fixed with it: a v/vt/vn line whose components do not parse is refused rather than dropped - dropping it shifted every later 1-based index, so `f 1 2 4` silently named a different vertex and the reader returned Ok with geometry the file does not describe, where upstream refuses the file - and the keyword is split on any ASCII whitespace, so a tab-delimited file is no longer invisible to the dispatch and decoded to an empty mesh."

