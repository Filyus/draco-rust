# Decode hardening status for Rust Draco.
#
# Purpose:
# - Track malformed-input and resource-hardening work separately from
#   actionable_status.yaml so the main actionable file stays short.
# - Keep completed hardening evidence, residual risk, and next investigation
#   steps in one place.
# - Do not use this file as a full implementation inventory; detailed completed
#   behavior still belongs in implementation_state.yaml.

version: 1
last_reviewed: "2026-06-15"

scope:
  crate: "draco-core"
  surface: "Rust DRC decode of mesh and point-cloud streams"
  compatibility_floor: "Draco 1.0.0+ for supported compatibility claims"
  threat_model:
    controlled_assets: "Known-good generated/fixture streams from trusted pipelines."
    untrusted_assets: "Externally supplied .drc bytes that may be truncated, corrupted, inconsistent, oversized, or adversarial."

readiness:
  controlled_assets: "good"
  opportunistic_untrusted_decode: "good"
  arbitrary_hostile_input: "not_claimed"
  summary: "Positive-path decode coverage is strong for the supported fixture set. Malformed-input behavior has deterministic regression coverage and several panic/resource hazards have been converted into controlled failures. Coverage-guided fuzzing is now operationalized (seed corpus + documented routine in FUZZING.md) and has already found and fixed multiple malformed-input hazards: count-driven memory-amplification OOMs (EdgeBreaker geometry counts, point-cloud point count, rANS probability table), an integer-overflow panic in portable-texcoord prediction (now wrapping like C++), and a multi-second CPU/memory DoS from an unbounded texcoord orientation count. All are pinned as deterministic regression tests. Caller resource policy is now documented in SECURITY.md. After these fixes a 300-second local campaign (24,715 executions, peak RSS under 1 GB) over the seeded corpus completed with no panic, OOM, or timeout. Fuzzing now runs in CI on Linux/ASan with release semantics (cargo-fuzz -O): a bounded smoke gate on every PR/push (no scheduled runs) with a cache-persisted corpus, a longer soak and ClusterFuzzLite PR/batch/prune available on manual dispatch. Remaining confidence is a function of accumulated soak time before arbitrary-hostile-input claims; note that development (non -O) fuzzing additionally surfaces DRACO_DCHECK-equivalent debug_assert! invariant violations, which are debug-only and do not reproduce in the shipped release build."

