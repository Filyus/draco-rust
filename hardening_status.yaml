# Decode hardening status for Rust Draco.
#
# Purpose:
# - Track malformed-input and resource-hardening work separately from
#   actionable_status.yaml so the main actionable file stays short.
# - Keep completed hardening evidence, residual risk, and next investigation
#   steps in one place.
# - Do not use this file as a full implementation inventory; detailed completed
#   behavior still belongs in implementation_state.yaml.

version: 1
last_reviewed: "2026-08-01"

scope:
  crate: "draco-core"
  surface: "Rust DRC decode of mesh and point-cloud streams"
  secondary_surface: "draco-gltf lossless document parsing and document-preserving Draco transforms for untrusted glTF/GLB bytes."
  tertiary_surface: "draco-io FBX reading: two hand-written parsers for untrusted input -- a length-prefixed binary container with a zlib path, and an ASCII container parsed as text."
  quinary_surface: "draco-core encoding of caller-supplied geometry: a point count, an index buffer, attribute layouts, per-point attribute mappings and encoder options, all of which typically originate in a file some other library parsed and none of which the data model validates where it is set."
  quaternary_surface: "draco-texture KTX2 reading and Basis transcoding: a header of file-controlled offsets and lengths, a Zstd payload whose uncompressed size the header declares before it is decompressed, and block data indexed arithmetically from the dimensions the file states."
  compatibility_floor: "Draco 1.0.0+ for supported compatibility claims"
  threat_model:
    controlled_assets: "Known-good generated/fixture streams from trusted pipelines."
    untrusted_assets: "Externally supplied .drc bytes that may be truncated, corrupted, inconsistent, oversized, or adversarial."
    untrusted_gltf: "Externally supplied glTF/GLB bytes passed to draco-gltf; may reference out-of-range/oversized accessors, malformed GLB chunks, or hostile external resource URIs."
    untrusted_encode_input: "Geometry assembled from an externally supplied file and handed to MeshEncoder/PointCloudEncoder: face indices past the point count, attributes shorter than the point count or mapped past their own value array, zero-component or untyped attributes, and quantization or version options outside any supported range."
    untrusted_fbx: "Externally supplied FBX bytes passed to draco-io; node records carry file-controlled lengths that feed allocations, arrays may be zlib-compressed, and the ASCII container is unbounded text."

readiness:
  controlled_assets: "good"
  opportunistic_untrusted_decode: "good"
  arbitrary_hostile_input: "not_claimed"
  summary: "Positive-path decode coverage is strong for the supported fixture set. Malformed-input behavior has deterministic regression coverage and several panic/resource hazards have been converted into controlled failures. Coverage-guided fuzzing is now operationalized (seed corpus + documented routine in FUZZING.md) and has already found and fixed multiple malformed-input hazards: count-driven memory-amplification OOMs (EdgeBreaker geometry counts, point-cloud point count, rANS probability table), an integer-overflow panic in portable-texcoord prediction (now wrapping like C++), and a multi-second CPU/memory DoS from an unbounded texcoord orientation count. All are pinned as deterministic regression tests. Caller resource policy is now documented in SECURITY.md. After these fixes a 300-second local campaign (24,715 executions, peak RSS under 1 GB) over the seeded corpus completed with no panic, OOM, or timeout. Fuzzing now runs in CI on Linux/ASan with release semantics (cargo-fuzz -O): a bounded smoke gate on every PR/push (no scheduled runs) with a cache-persisted corpus, a longer soak and ClusterFuzzLite PR/batch/prune available on manual dispatch. Remaining confidence is a function of accumulated soak time before arbitrary-hostile-input claims; Encoding is now fuzzed as well: encode_drc builds geometry from the fuzz input and requires that the encoder never panics and that anything it accepts decodes, which found six encoder hazards - a zero-component attribute indexing an empty axis array, an attribute mapping reading past its own buffer, a face index past the point count, an unsupported target bitstream version, a point-cloud header missing its flags field below 1.3, and the legacy predictive traversal written into a 2.x stream - all fixed and pinned in encoder_hardening_test.rs. Note that development (non -O) fuzzing additionally surfaces DRACO_DCHECK-equivalent debug_assert! invariant violations, which are debug-only and do not reproduce in the shipped release build."

