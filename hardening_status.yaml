    note: "SECURITY.md documents the decode threat model and recommended caller limits for untrusted input (input byte-size cap, memory budget, timeout/cancellation, process/WASM isolation, minimal decoder feature surface), making explicit that the crate avoids artificial geometry caps by design and that bounding cost is a caller responsibility."

  - id: fbx-ascii-parser-fuzzed
    status: covered
    evidence:
      - path: "crates/draco-io/examples/fbx_make_seeds.rs"
      - path: "crates/draco-io/tests/fbx_seeds.rs"
        tests:
          - "every_seed_is_what_the_generator_says_it_is"
    note: "The ASCII FBX parser was reachable in principle and unexercised in practice: every seed began with the binary magic, so mutation would essentially never synthesize a `; FBX` or `FBXHeaderExtension:` prefix. Five ASCII seeds now cover a valid document, a deep block nest, a huge declared array length, an unterminated string and an unterminated block. Two things the seeding surfaced: the 'valid' seed reached the parser but not the scene builder, because it carried no Connections section and so produced zero meshes, and the committed valid_triangle.fbx predated a writer change and no longer matched what the generator emits. A seed-validity test now asserts what each seed does under both lenient and strict options - two binary seeds parse leniently and fail strictly, which the first version of the table got wrong - and asserts the committed fixture still matches a freshly written triangle. Campaign over the widened corpus: 452,946 executions, 2,323 new units, clean."

  - id: encode-legacy-version-round-trip
    status: covered
    evidence:
      - path: "crates/draco-core/src/version.rs"
      - path: "crates/draco-core/src/mesh_edgebreaker_encoder.rs"
      - path: "crates/draco-core/tests/version_roundtrip_test.rs"
        tests:
          - "every_edgebreaker_traversal_round_trips_at_every_claimed_version"
          - "every_attribute_coding_round_trips_at_every_claimed_version"
          - "a_mesh_with_topology_splits_round_trips_at_every_claimed_version"
          - "a_sequential_mesh_at_1_3_survives_the_varint_index_boundary"
      - path: "crates/draco-core/tests/rust_vs_cpp_decode_test.rs"
        tests:
          - "cpp_decodes_the_legacy_streams_this_crate_writes"
          - "cpp_decodes_legacy_normal_and_tex_coord_encodings"
          - "cpp_decodes_the_predictive_traversal_this_crate_writes"
    note: "set_version accepted an interval - 1.0 to the newest, 259 values for a mesh including minors that never existed - and most produced a stream this crate's own decoder rejects. It now takes an enumeration keyed on the coder that writes the stream, and membership requires a round-trip test that compares values rather than counts, which is precisely what let the earlier point-cloud tests pass over a stream whose quantization parameters were in the wrong place. The first attempt refused three legacy combinations rather than writing them; that was wrong - legacy_bitstream_encode exists to write legacy streams - and all three, plus a fourth nobody had listed, turned out to be one root cause in five places: a sub-buffer built with EncoderBuffer::new() reports version 0, which every version branch reads as newest, so each wrote a 2.2 layout inside an older stream. Two more encoder/decoder disagreements came out with it: sequential counts switch to varints at 2.2 rather than at the major, and sequential face indices had no version gate at all, so a 1.3 mesh with 65,536 or more points decoded without error, with the right face count, and with different faces. A sixth place surfaced afterwards, from asking why 1.1 had been dropped: topology split events below 1.2 are two absolute u32 ids and an edge byte with no bit-coded section, and the encoder only ever wrote the 1.2 form. Nothing caught it because every mesh in these tests was a grid, a grid is a disc, and a disc produces no split events at all - so 1.1's round-trip test was passing on a stream with an empty event section. The mesh for that one is a grid with three holes punched in it, which is what makes the traversal come back to a boundary it has seen. 1.1 is claimed again. A Rust-to-Rust round trip cannot vouch for a legacy version, since the only reason to write one is that something else reads it, so the same stream goes through the real draco_decoder: every built C++ version from 0.10.0 to 1.5.7 returns the geometry, and every one of them fails outright on what the encoder produced before the fix. The fuzz oracle's version exclusion is gone, which was covering the target's largest blind spot with the very thing it was meant to find. A seventh and eighth defect surfaced from widening the C++ coverage past positions: a stream written at compression level 0 by Draco 0.9.1 or 0.10.0 decoded to the origin rather than its geometry, because the pre-2.0 shims that walk the prediction header tested only the 0xFF sentinel this crate itself once wrote and not upstream's PREDICTION_NONE (0xFE), stepping one byte into the stream and reading the quantization range shifted; and the encoder named prediction schemes in bitstreams that predate them, which is the general form of a defect first seen as MeshPredictionGeometricNormal at 1.1 and 1.2 putting roughly 40% of a mesh's normals on the wrong point while the counts stayed right. Neither was visible from a Rust-to-Rust round trip for the same reason as the rANS token: this crate's encoder and decoder agreed with each other while being wrong. The sentinel is a one-line fix; the scheme defect took reading the upstream trees to state rather than guess. MESH_PREDICTION_CONSTRAINED_MULTI_PARALLELOGRAM arrives in Draco 0.10.0, which writes bitstream 1.2, and MESH_PREDICTION_TEX_COORDS_PORTABLE and MESH_PREDICTION_GEOMETRIC_NORMAL in Draco 1.0.0, which writes 2.0 - neither of the latter two identifiers occurs anywhere in the 0.9.1 or 0.10.0 sources - so the encoder now carries an introduction version per scheme and substitutes the one the era used, pinned by a test over every scheme against every version the encoder claims. Naming one anyway is not a graceful degradation: 0.9.1 hands an id it does not recognise to PredictionSchemeDifference, so the corrections are read as plain deltas and the file opens with the right vertex count and different geometry. The two position-predicting schemes are worse, because a modern decoder accepts them and answers wrongly: below 2.0 upstream's InitPredictionScheme gives the predictor the final position attribute rather than the portable one, that attribute already holds dequantized floats, and GetPositionForDataId truncates them into VectorD<int64_t, 3>, so on a unit-scale mesh every cross product is degenerate whatever the encoder predicted against. That branch exists for MESH_PREDICTION_TEX_COORDS_DEPRECATED, the one pre-2.0 scheme with a parent attribute, whose predictor really is float-domain - which is why the earlier attempt to match domains could not converge, and why this is a refusal to write a combination the format does not contain rather than a fix left half-understood. The decoder mirrors both upstream branches regardless, so a genuine old file that used either scheme below 2.0 still reads."

  - id: decode-allocation-bounded-by-input-ratio
    status: covered
    evidence:
      - path: "crates/draco-core/src/decode_budget.rs"
      - path: "crates/draco-core/src/sequential_integer_attribute_decoder.rs"
      - path: "crates/draco-core/tests/drc_edge_cases_test.rs"
        tests:
          - "oversized_drc_counts_fail_before_large_allocation"
          - "a_hundred_thousand_identical_points_round_trip"
    note: "Replaces the header count-versus-size guard, whose premise - at least one bit per point or face - is false for entropy-coded data: geometry whose values are all equal codes to a size independent of the count, so this crate wrote 100,000 points into 171 bytes and then refused to read the file back, which made the guard an interoperability bug as well as a false negative. A decode may now allocate up to 2^20 bytes per input byte, applied where the buffers are sized rather than at the header, so it scales with the input instead of capping geometry. Measured rather than assumed: try_reserve_exact for 51 GB succeeds on Windows in 0.165s and the KD-tree decoder then spends 14.5s writing into it, so fallible allocation alone bounds nothing when the allocator says yes; with the budget the same input is refused in 0.000s. Upstream's own `faces > remaining/3` is deliberately not adopted - its premise fails for the compressed connectivity branch for the same reason. The EdgeBreaker topology-split guard is kept: one byte per event is a floor, not an average, which is what makes that one sound. The four decode-path allocations sized from num_points * num_components became fallible first, and the product is computed with checked_mul because usize is 32 bits on wasm32."

  - id: decode-error-api-converted
    status: covered
    evidence:
      - path: "crates/draco-core/src/attribute_transform.rs"
      - path: "crates/draco-core/src/prediction_scheme.rs"
      - path: "crates/draco-core/src/sequential_integer_attribute_decoder.rs"
      - path: "crates/draco-core/src/direct_bit_decoder.rs"
        tests:
          - "a_read_past_the_last_bit_is_not_a_zero_bit"
      - path: "crates/draco-core/tests/drc_edge_cases_test.rs"
        tests:
          - "a_truncated_stream_names_what_ran_out"
    note: "Ninety-odd bool-returning functions across the attribute transforms, the prediction-scheme family and the sequential attribute coders now return Status, and their failures propagate to MeshDecoder/PointCloudDecoder/MeshEncoder/PointCloudEncoder instead of being replaced by a fixed sentence one hop below the API. Where a reason already existed it was going to a debug_log! the release build drops - 55 of them in the integer attribute decoder alone. Pinned by a regression that cuts a real encode at every length and requires the wrap transform's own words to reach MeshDecoder::decode, three layers up; falsified by making run_decode_prediction_data discard the cause. Predicates stay bool. Two panics came out with the conversion (see quantization-transform-direction-agreement) and one latent gap: the normal encoder accepted a quantization bit count of 1 or above 30 while the octahedron transform carries 2..=30, leaving it uninitialised and failing later at the folding step with nothing naming the cause. The EdgeBreaker traversal's Result<_, String> became Result<_, DracoError>, removing the last error type in the crate that was not DracoError. DracoError itself became an opaque pointer-sized struct in the shape of std::io::Error, because with the message inline every one of these functions returned 32 bytes through an out-pointer and every ? expanded to String drop glue; that is worth 2.6 KiB gzip in the glTF WASM module. The diagnostics themselves cost far more - 16 KiB in the same module, measured by blanking every message and rebuilding - which is why the web budget moved rather than the messages. What this does not cover is the rANS read-past-the-end signal - see rans-over-read-call-site-bounds."

  - id: quantization-transform-direction-agreement
    status: covered
    evidence:
      - path: "crates/draco-core/src/attribute_quantization_transform.rs"
        tests:
          - "quantizing_with_parameters_from_a_narrower_attribute_is_refused"
          - "encoding_parameters_from_an_uninitialized_transform_is_refused"
    note: "Two defects on one type, both from its two directions disagreeing about what they check. generate_portable_attribute indexes min_values per component - the fast path writes [0], [1], [2] literally - while min_values was sized by compute_parameters from whichever attribute it was given; parameters computed for two components and applied to three panicked with 'the len is 2 but the index is 2', reachable through the public AttributeTransform::transform_attribute, and the inverse direction had checked that length since it was written. encode_parameters wrote -1 truncated to 0xFF as the quantization-bits byte and reported success - a value no decoder accepts - where the sibling octahedron transform had always gated the same method. Both regressions were written from a reproduction first."

  - id: decode-path-indexing-audit
    status: covered
    evidence:
      - path: "crates/draco-core/src/corner_table.rs"
        tests:
          - "a_corner_past_the_table_is_invalid_rather_than_a_panic"
      - path: "crates/draco-io/src/traits.rs"
      - path: "crates/draco-core/src/prediction_scheme_tex_coords_portable.rs"
    note: "CornerTable::opposite and vertex guarded the invalid sentinel but not the upper bound, and roughly twenty-five index expressions in that file funnel through the two; they return the sentinel for a corner past the table now, which callers already handle. is_index_consistent is the whole-table check that would rule this out up front and is called at three sites rather than at every entry point, which is why the primitives had to be total. Separately the four draco-io mesh writers read attribute data as point * byte_stride through the panicking DataBuffer::read at nine call sites; that is sound exactly when each attribute holds at least num_points values, and nothing between a decoder and a writer re-checked it, so one precondition at each writer's entry point now makes the nine provably in range. Two unwrap() calls on the portable tex-coord encode path went with the prediction-scheme conversion: mesh_data and data_to_corner_map were unwrapped after a check covering only the first."

open_risks:
  - id: rans-over-read-call-site-bounds
    priority: medium
    summary: "An rANS bit decoder cannot report reading past the encoded bits, so every caller has to bound its own read count structurally, and those bounds have not all been audited."
    why_it_matters: "RAnsBitDecoder::decode_next_bit answers false for an encoded zero and for a spent stream alike, and unlike DirectBitDecoder it cannot be made to tell them apart: the obvious test - the rABS state below l_base after renormalization with no bytes left - holds on 21049 of 79359 reads (26%) over this crate's own round-trip suite, every one in a stream encoded and decoded back byte-exactly, because the rABS tail legitimately draws from state alone. Upstream has no check either. So a read count that overshoots yields deterministic garbage rather than an error, and the only real guard is a structural bound at the call site. The prediction schemes have theirs - crease-edge flags against the corner count, orientations against the entry count - and the KD-tree's DirectBitDecoder reads now refuse outright. The EdgeBreaker start-face and seam readers have not been checked against this question."
    next_steps:
      - "Enumerate the rANS decode_next_bit call sites and state, per site, what bounds the read count and where that bound is itself checked."
      - "Add a structural bound where a site has none, following the crease-edge and orientation pattern rather than a size-in-bits premise."
      - "This is a wrong-geometry rather than a memory-safety concern: the loops are bounded by counts that already have their own guards, so what an over-read produces is garbage output, not an out-of-bounds access."

  - id: fuzzing-ci-soak-time
    priority: low
    summary: "Fuzzing runs in CI on Linux/ASan, release semantics (Level 1 bounded smoke on every PR/push with cache-persisted corpus in fuzz.yml; Level 2 ClusterFuzzLite PR fuzzing in cflite_pr.yml). Deeper runs (fuzz.yml soak, ClusterFuzzLite batch/prune) are manual dispatch — there are no scheduled runs. Confidence still grows with cumulative soak time and corpus depth."
    why_it_matters: "The change-triggered jobs catch regressions and shake out new hostile-input hazards, but arbitrary-hostile-input confidence is a function of total fuzzing hours and corpus coverage, which accrue over time rather than from a single run."
    next_steps:
      - "Run the manual soak / ClusterFuzzLite batch periodically (e.g. before a release) to accumulate corpus and coverage; review any uploaded crash artifacts promptly."
      - "Consider full OSS-Fuzz onboarding (the .clusterfuzzlite build integration is OSS-Fuzz-compatible) for continuous infrastructure-scale fuzzing."
      - "Optionally add a coverage-report cron once the address-sanitizer batch path is established."

  - id: resource-policy-enforcement
    priority: low
    summary: "Caller resource policy is now documented in SECURITY.md, but the crate cannot enforce caller-side input-size, timeout, and memory limits on its own."
    why_it_matters: "Draco is designed for large meshes, so the crate avoids artificial geometry caps; count-driven allocations are now bounded relative to input, but a genuinely large valid stream still needs caller-side operational limits."
    next_steps:
      - "Keep decoder internals focused on overflow checks, relative input-consistency bounds, and fallible allocation rather than artificial mesh-size caps."
      - "Point production integrators at SECURITY.md for input-size, worker-isolation, timeout/cancellation, and memory-budget guidance."

exit_criteria:
  controlled_assets:
    - "Supported fixture inventory decodes successfully."
    - "Legacy Draco 1.0.0+ smoke fixtures remain covered."
    - "Malformed edge-case regression tests pass."
  arbitrary_hostile_input:
    - "Fuzz/property entrypoint runs in CI or documented pre-release process."
    - "DRC-level Edgebreaker corruption cases fail without panic."
    - "Caller resource policy is documented."
    - "Decode-path panic/indexing audit has no known reachable malformed-input panics."
