          - "oversized_texcoord_orientations_decode_quickly_without_hang"
    note: "PredictionSchemeTexCoordsPortableDecoder::decode_prediction_data now rejects a declared orientation count beyond remaining_size*8 before reserving and rANS-bit-decoding each orientation in a loop. C++ Draco checks only num_orientations < 0; the raw i32 count (up to ~2.1 billion) otherwise drove a ~2 second decode and multi-GB reservation. Found by the decode_drc fuzz target as a slow-unit/timeout from a 224-byte EdgeBreaker mesh input that reconstructs only 12 faces."

  - id: edgebreaker-traversal-corner-table-consistency
    status: covered
    evidence:
      - path: "crates/draco-core/src/corner_table.rs"
        tests:
          - "is_index_consistent_accepts_valid_and_rejects_malformed"
      - path: "crates/draco-core/src/mesh_edgebreaker_decoder.rs"
      - path: "crates/draco-core/src/mesh_decoder.rs"
    note: "CornerTable::is_index_consistent() validates that every vertex index is < num_vertices and every opposite-corner index is < num_corners (with a matching opposite-map length) before the EdgeBreaker attribute traversals (assign_points_to_corners and the DFS/max-prediction-degree point-id generators) index per-vertex/per-face arrays by table-derived ids. A malformed attribute-seam corner table previously produced an out-of-bounds vertex index and a real (debug+release) index-panic. Found by the decode_drc fuzz target (index out of bounds in assign_points_to_corners)."

  - id: fuzz-profile-release-semantics
    status: covered
    evidence:
      - path: "fuzz/Cargo.toml"
      - path: "FUZZING.md"
    note: "The fuzz profile disables debug-assertions and overflow-checks so campaigns target shipped release behavior. The decoder intentionally relies on two's-complement wrapping (matching C++) and DRACO_DCHECK-equivalent debug_assert! invariants that are compiled out in release; fuzzing with them on tripped on dev-time checks rather than real hostile-input hazards. Memory-safety coverage is unaffected: out-of-bounds indexing still panics in release Rust and is still caught, as are OOMs, timeouts, and unbounded loops."

  - id: fuzzing-corpus-and-routine
    status: covered
    evidence:
      - path: "fuzz/seed_corpus.ps1"
      - path: "fuzz/seed_corpus.sh"
      - path: "FUZZING.md"
    note: "The git-ignored libFuzzer corpus is reproducibly seeded from the 98 committed .drc fixtures via fuzz/seed_corpus.{ps1,sh}, and FUZZING.md documents the install/seed/run/minimize/triage routine, the Windows sanitizer-runtime nuance, and the requirement to pin any new crash as a deterministic regression test. Bounded campaigns have been run locally; corpus-persisted CI runs remain the open follow-up."

  - id: fbx-binary-reader-hardening
    status: covered
    evidence:
      - path: "crates/draco-io/src/fbx_options.rs"
      - path: "crates/draco-io/src/fbx_reader.rs"
      - path: "crates/draco-io/tests/fbx_corpus.rs"
      - path: "fuzz/fuzz_targets/fbx_read_scene.rs"
      - path: "fuzz/fuzz_targets/fbx_roundtrip.rs"
    note: "FbxDecodeLimits bounds file size, node count, nesting depth, per-node property count, string/blob payloads, and per-array and total array bytes, with defaults calibrated against the 308-file ufbx binary corpus rather than guessed. Limit violations fail with OutOfMemory and structural violations with InvalidData so a caller can tell them apart. Backwards end offsets, oversized records, zip bombs and array-length overflow are refused; strict mode additionally validates the container layout. A cycle in the Model hierarchy no longer recurses until the stack is exhausted. The opt-in corpus test asserts no panic, no hang and bounded output over every file, and two libFuzzer targets cover reading and the read/write round trip."

  - id: ktx2-differential-against-the-reference
    status: covered
    evidence:
      - path: "web/tests/ktx2-differential.mjs"
      - path: "crates/draco-texture/src/ktx2.rs"
      - path: "crates/draco-texture/tests/ktx2_container.rs"
    note: "2400 mutants of the six seeds are fed to both this reader and Binomial's, and every image both accept must be byte-identical: 2505 images are, over four targets. It found a real defect on its first run -- the key/value section's range was never checked, so a file whose section ran past the end of the file was read as if it had none, which the reference refuses; the two then disagreed about the pixels of a file neither should have read. Fixed, with a regression test. Two things are deliberately out of scope and stated in the gate: the key/value section itself, because this reader reports it while the reference acts on it, so a garbled one leaves both right and different; and acceptance, which diverges by design and is tallied against a ceiling rather than asserted -- measured at 6 mutants only this reader read and 174 only the reference did. One more finding is about the oracle rather than this reader: fed malformed input, Binomial's module can return success from transcodeImage having written nothing, so the pristine seed is transcoded again after every mutant and a comparison from a degraded instance is discarded rather than believed."

  - id: ktx2-fuzzing-throughput
    status: covered
    evidence:
      - path: "crates/draco-texture/examples/ktx2_make_seeds.rs"
      - path: "crates/draco-texture/tests/ktx2_seeds.rs"
      - path: "fuzz/fuzz_targets/ktx2_transcode.rs"
    note: "The target first ran at 4 executions per second, because every seed was a full 512x512 or 1024x1024 texture decoded into seven formats across every mip level. Two changes, both measured: the decode bound is per level rather than per file, so a large fixture still has its small mips decoded and its supercompression and codebooks still read; and six seeds of 8 and 64 texels are generated by rebuilding fixtures around their smallest level, with the Zstd undone so that mutations land on block bits rather than dying in a frame checksum. Result: 64 executions per second at 4887 edges and 16726 features, against 4 per second at 5048 edges and 15524 features before -- sixteen times the rate and more features than the slow configuration reached. A 300-second campaign over the seeded corpus (ASan, release semantics) completed with no crash, no OOM and no timeout: 13521 executions, 5149 edges, 20474 features, peak RSS 510 MB. ktx2_seeds.rs asserts every seed still parses and decodes, since a seed that does not leaves the corpus looking stocked and the engine starting from nothing."

  - id: ktx2-reader-hardening
    status: covered
    evidence:
      - path: "crates/draco-texture/src/ktx2.rs"
      - path: "crates/draco-texture/tests/ktx2_container.rs"
      - path: "crates/draco-texture/tests/ktx2_malformed.rs"
      - path: "fuzz/fuzz_targets/ktx2_transcode.rs"
    note: "Offsets and lengths are checked as fits-in-what-is-left rather than as offset plus length, which wraps and passes. Dimensions are bounded at 16384 either way, without which every buffer sized as width by height wraps at 32 bits on the wasm32 target this ships to. A Zstd level's declared uncompressed length is bounded by what a level of those dimensions could hold, because it is what the output buffer is reserved from before anything is decompressed. Level and layer counts are bounded, and the ETC1S global data offsets are accumulated with checked addition and validated before the descriptor array is built. Six regression tests pin the individual cases, four sweeps cover every header field at eight extreme values, every truncation of every fixture and wholesale payload corruption, and a libFuzzer target parses arbitrary bytes and transcodes every level into every target. The two dimension and level-length bounds were added after auditing six 2026 hardening commits to the reference reader; the other four cases they cover were already handled."

  - id: encode-input-validation
    status: covered
    evidence:
      - path: "fuzz/fuzz_targets/encode_drc.rs"
      - path: "crates/draco-core/tests/encoder_hardening_test.rs"
      - path: "crates/draco-core/src/point_cloud_encoder.rs"
      - path: "crates/draco-core/src/mesh_encoder.rs"
      - path: "crates/draco-core/src/version.rs"
      - path: "crates/draco-core/src/attribute_quantization_transform.rs"
    note: "The encoders validate caller-supplied geometry once, before any encoder path derives a stride, a dimension or an offset from it: attributes must have components, a valid data type, and a point map that lands inside their own value array; mesh faces must reference points the mesh has; the target bitstream version must be one the crate writes; and the legacy predictive traversal is refused above 2.0. The quantization transform returns a failure instead of indexing when a source offset falls outside the buffer, matching its octahedron counterpart. Found by the encode_drc libFuzzer target, which also caught a point-cloud header that omitted its flags field below version 1.3 and so produced a stream its own decoder could not read; all cases are pinned in encoder_hardening_test.rs."

  - id: caller-resource-policy-documented
    status: covered
    evidence:
      - path: "SECURITY.md"
    note: "SECURITY.md documents the decode threat model and recommended caller limits for untrusted input (input byte-size cap, memory budget, timeout/cancellation, process/WASM isolation, minimal decoder feature surface), making explicit that the crate avoids artificial geometry caps by design and that bounding cost is a caller responsibility."

open_risks:
  - id: fbx-ascii-parser-unfuzzed
    priority: medium
    summary: "The ASCII FBX parser added in fbx_ascii.rs is a hand-written recursive-descent parser over untrusted text, and the fuzz corpus contains no ASCII seeds."
    why_it_matters: "The libFuzzer targets call FbxScene::from_bytes_with_options, which auto-detects the container, so the ASCII path is reachable -- but every seed produced by crates/draco-io/examples/fbx_make_seeds.rs begins with the binary magic, and a mutation engine will essentially never synthesize a `; FBX` or `FBXHeaderExtension:` prefix from them. The parser is therefore reachable in principle and unexercised in practice. It does honour FbxDecodeLimits for file size, depth, node count and array bytes, and its depth limit has a regression test, so this is missing coverage rather than a known hazard."
    next_steps:
      - "Add ASCII seeds to fbx_make_seeds.rs: a minimal valid document, one with a deep block nest, one with a huge declared array length, and one with an unterminated string or block."
      - "Re-run seed_corpus.{sh,ps1} and confirm the ASCII branch is reached, for example by checking coverage or by asserting a seed decodes."
      - "Run a bounded campaign over the widened corpus before claiming the ASCII path is hardened."

  - id: fuzzing-ci-soak-time
    priority: low
    summary: "Fuzzing runs in CI on Linux/ASan, release semantics (Level 1 bounded smoke on every PR/push with cache-persisted corpus in fuzz.yml; Level 2 ClusterFuzzLite PR fuzzing in cflite_pr.yml). Deeper runs (fuzz.yml soak, ClusterFuzzLite batch/prune) are manual dispatch — there are no scheduled runs. Confidence still grows with cumulative soak time and corpus depth."
    why_it_matters: "The change-triggered jobs catch regressions and shake out new hostile-input hazards, but arbitrary-hostile-input confidence is a function of total fuzzing hours and corpus coverage, which accrue over time rather than from a single run."
    next_steps:
      - "Run the manual soak / ClusterFuzzLite batch periodically (e.g. before a release) to accumulate corpus and coverage; review any uploaded crash artifacts promptly."
      - "Consider full OSS-Fuzz onboarding (the .clusterfuzzlite build integration is OSS-Fuzz-compatible) for continuous infrastructure-scale fuzzing."
      - "Optionally add a coverage-report cron once the address-sanitizer batch path is established."

  - id: resource-policy-enforcement
    priority: low
    summary: "Caller resource policy is now documented in SECURITY.md, but the crate cannot enforce caller-side input-size, timeout, and memory limits on its own."
    why_it_matters: "Draco is designed for large meshes, so the crate avoids artificial geometry caps; count-driven allocations are now bounded relative to input, but a genuinely large valid stream still needs caller-side operational limits."
    next_steps:
      - "Keep decoder internals focused on overflow checks, relative input-consistency bounds, and fallible allocation rather than artificial mesh-size caps."
      - "Point production integrators at SECURITY.md for input-size, worker-isolation, timeout/cancellation, and memory-budget guidance."

  - id: encode-legacy-version-round-trip
    priority: medium
    summary: "An explicitly requested non-default bitstream version can still produce a stream this crate's own decoder rejects, so encode_drc's round-trip oracle is held to the default version."
    why_it_matters: "Legacy encode is version-gated field by field, and the gates are not all consistent with the decoder's: a point-cloud header written at 1.0 was two bytes short until this was fixed, and a sequential mesh at 2.1 still ends short. Nothing here is a memory-safety hazard - the encoder refuses or the decoder errors - but a caller that sets set_version for interoperability can get an unreadable file back."
    next_steps:
      - "Enumerate which versions the encoders actually claim, per geometry type and method, and reject the rest at validate_encodable_version rather than per field."
      - "For each claimed version, add an encode/decode round-trip test, then narrow round_trip_is_claimed in fuzz/fuzz_targets/encode_drc.rs to what remains."

  - id: decoder-count-guard-is-unsound
    priority: medium
    summary: "The decoder's header preflight rejects a point/face count above the remaining bitstream size in bits. The premise - at least one bit per point - is false, and the guard rejects streams this crate and C++ Draco both produce."
    why_it_matters: "A geometry whose attribute values are all equal entropy-codes to a size independent of the point count: this encoder writes 100,000 points into 171 bytes, and its own decoder then refuses that file. So the guard is an interoperability bug as well as a false negative for hardening. It is also what currently bounds count-driven allocation from a tiny header, which is why it cannot simply be deleted."
    next_steps:
      - "Establish what actually bounds allocation once the guard is gone: every count-driven allocation is already fallible, so the question is whether fallible allocation alone is enough under overcommit, or whether an explicit decode limit is needed as the FBX and KTX2 readers have."
      - "Replace the relative guard with whichever of those the answer is, keeping oversized_drc_counts_fail_before_large_allocation passing."
      - "Remove the matching exclusion from round_trip_is_claimed in fuzz/fuzz_targets/encode_drc.rs."

  - id: decode-error-api-cleanup
    priority: medium
    summary: "Several low-level entropy, prediction, and transform decode helpers still use bool returns, which loses failure context."
    why_it_matters: "The recent panic-guard cleanup prevents selected unwrap panics, but callers still often see a generic false instead of a structured DracoError."
    next_steps:
      - "Audit remaining decode-only bool APIs in rANS/direct-bit/folded-bit/prediction helpers."
      - "Convert the most externally reachable helpers to Result-based wrappers in small, mechanical commits."
      - "Keep encoder-only invariant expects out of the malformed-input hardening scope unless they become public API concerns."

  - id: decode-path-indexing-audit
    priority: medium
    summary: "A final audit is still needed for unchecked indexing and DataBuffer reads reachable from lower-level decode helpers."
    why_it_matters: "Many obvious prediction unwraps, geometric-normal position reads, octahedron transform slices, and KD-tree attribute writes are now guarded, but slice/indexing panics can still hide in lower-level attribute or buffer helpers."
    next_steps:
      - "Audit decoder-facing DataBuffer::read/write callers and attribute transform offsets."
      - "Prefer local bounds checks or fallible helper variants where malformed input can control offsets."
      - "Add targeted malformed-input regressions when a reachable panic candidate is found."

exit_criteria:
  controlled_assets:
    - "Supported fixture inventory decodes successfully."
    - "Legacy Draco 1.0.0+ smoke fixtures remain covered."
    - "Malformed edge-case regression tests pass."
  arbitrary_hostile_input:
    - "Fuzz/property entrypoint runs in CI or documented pre-release process."
    - "DRC-level Edgebreaker corruption cases fail without panic."
    - "Caller resource policy is documented."
    - "Decode-path panic/indexing audit has no known reachable malformed-input panics."
