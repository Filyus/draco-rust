name: "Pages: deploy converter"
# Name the run after the commit it is judging, which is not the one GitHub
# files it under: a `workflow_run` run is attributed to the tip of the default
# branch, while the gate reads the *triggering* run's commit. Those differ
# whenever a check for an older commit finishes late, and the run list then
# reads as several deploys of the newest commit when one of them was about
# something else entirely.
run-name: "pages: ${{ github.event.workflow_run.head_sha || github.sha }} (after ${{ github.event.workflow_run.name || 'manual dispatch' }})"

# The converter is the only place the web modules are shown working together --
# import, inspect, compress, view, export -- and until now it existed solely as
# a local build. `Release: WASM assets` publishes the modules for consumers;
# this publishes the app that uses them.
#
# Deploying is gated on the checks rather than on the push, so the site is only
# ever built from a commit `Rust CI` and `Fuzz` have both accepted. Either of
# them completing fires this workflow; the gate below decides whether that is
# yet enough.
on:
  workflow_run:
    workflows: ["Rust CI", "Fuzz"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  # The gate reads the sibling workflow's runs, and the environment's
  # deployment history to learn what is actually published.
  actions: read
  deployments: read

jobs:
  # Two questions, and the second is the one that is easy to get wrong.
  #
  # Are both checks happy? A workflow that produced no run for this commit is
  # not pending -- `Fuzz` filters pushes by path, so a web-only change never
  # starts it, and waiting for it would wait forever. Absent counts as
  # satisfied; only a run that exists and either has not finished or did not
  # succeed holds the deploy back.
  #
  # Is there anything to deploy? `workflow_run` carries no path filter, so the
  # one this workflow used to have is rebuilt here -- against the last commit
  # actually deployed rather than against this commit's parent, so a push of
  # several commits cannot walk past a change the way a one-commit diff would.
  gate:
    name: gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Dispatched by hand; deploying $SHA."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for workflow in "Rust CI" "Fuzz"; do
            states=$(gh run list --repo "$REPO" --commit "$SHA" --workflow "$workflow" --json status,conclusion --jq '.[] | "\(.status)/\(.conclusion // "-")"')
            if [ -z "$states" ]; then
              echo "$workflow: no run for this commit -- filtered out, not pending."
              continue
            fi
            if echo "$states" | grep -qv '^completed/'; then
              echo "$workflow: still running. Its completion will fire this again."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if echo "$states" | grep -qv '^completed/success$'; then
              echo "$workflow: did not succeed ($states). Not deploying."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$workflow: success."
          done

          # Ask what was deployed, not what ran. Now that a run can legitimately
          # end without deploying, its own history would answer the wrong
          # question -- the first such run would become the baseline and the
          # site would never move again.
          # A deployment record exists whether or not it succeeded, so take the
          # most recent one that actually did. Otherwise a failed deploy would
          # become the baseline and no later push would ever retry it.
          deployed=""
          for id in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=10" --jq '.[].id'); do
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = "success" ]; then
              deployed=$(gh api "repos/$REPO/deployments/$id" --jq '.sha')
              break
            fi
          done
          if [ -z "$deployed" ] || ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            echo "No previous deployment to compare against; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Out-of-order arrivals are possible -- two pushes in flight, one
          # cancelled by the concurrency group -- and publishing an ancestor
          # over its own descendant would quietly roll the site back.
          if git merge-base --is-ancestor "$SHA" "$deployed"; then
            echo "$deployed is already deployed and contains $SHA. Nothing to do."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$deployed" "$SHA" -- .github/workflows/pages.yml crates web)
          if [ -z "$changed" ]; then
            echo "Nothing under crates/, web/ or this workflow changed since $deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed since $deployed:"
          echo "$changed"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # `workflow_run` starts this workflow from the default branch, so the
      # commit to build has to be named rather than assumed.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install wasm-opt
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pages must already be enabled with "GitHub Actions" as its source. The
      # `enablement: true` input cannot do it: creating the site is a repository
      # setting, and `GITHUB_TOKEN` is refused with "Resource not accessible by
      # integration". Enabling it is a one-time manual step, in the repository
      # settings or through `gh api -X POST repos/OWNER/REPO/pages`.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # `build.sh` with no arguments builds the release profile, which is the
      # size gate rather than the app: the converter needs `--app`, and so does
      # anything that runs the front-end. It also runs `npm run build:ts`
      # itself, which is why the install has to come first.
      - name: Build the converter
        working-directory: web
        run: |
          npm ci
          bash ./build.sh --app

      # The site is index.html, style.css and build output beside them. Fail
      # here rather than deploying a page whose modules are missing.
      - name: Verify the built site
        shell: bash
        run: |
          set -euo pipefail

          test -f web/www/index.html
          test -f web/www/app.js
          for module in obj ply gltf fbx ktx2; do
            test -f "web/www/pkg/${module}_bg.wasm"
          done
          du -sh web/www

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
