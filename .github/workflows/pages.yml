name: "Pages: deploy converter"
# Name the run after the commit it is judging, which is not the one GitHub
# files it under: a `workflow_run` run is attributed to the tip of the default
# branch, while the gate reads the *triggering* run's commit. Those differ
# whenever a check for an older commit finishes late, and the run list then
# reads as several deploys of the newest commit when one of them was about
# something else entirely.
run-name: "pages: ${{ github.event.workflow_run.head_sha || github.sha }} (after ${{ github.event.workflow_run.name || 'manual dispatch' }})"

# The converter is the only place the web modules are shown working together --
# import, inspect, compress, view, export -- and until now it existed solely as
# a local build. `Release: WASM assets` publishes the modules for consumers;
# this publishes the app that uses them.
#
# Deploying is gated on the checks rather than on the push, so the site is only
# ever built from a commit `Rust CI` and `Fuzz` have both accepted.
#
# Only `Rust CI` fires this, and the gate waits for `Fuzz` itself. Listening to
# both instead gives one run per check, all but the last of which finds a
# sibling unfinished and declines -- and worse, the last one is only reliably
# last if the checks finish in the order the events arrive, which they need not.
# `Rust CI` has no path filter, so every push to main starts exactly one of it,
# which makes it the one dependable trigger.
on:
  workflow_run:
    workflows: ["Rust CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  # The gate reads the sibling workflow's runs.
  actions: read

jobs:
  # Waiting for the checks is the easy half. The hard half is that a workflow
  # which produced no run for this commit is not pending: `Fuzz` filters pushes
  # by path, so a web-only change never starts it, and waiting for it would wait
  # forever. Absent counts as satisfied.
  #
  # There is deliberately no "did anything relevant change?" test. This workflow
  # had one as a `paths:` filter, and `workflow_run` carries none, so rebuilding
  # it meant knowing which commit is currently published -- and the deployment
  # record cannot say. `actions/deploy-pages` files a deployment against the
  # run's own commit, which under `workflow_run` is the branch tip rather than
  # the commit the run checked out and built. Reading it back would have marked
  # the tip published without publishing it, and the tip's own run would then
  # decline as redundant, leaving the site frozen with everything green. So the
  # site is rebuilt on every accepted push: a few minutes of runner time in
  # exchange for a question that has no reliable answer.
  gate:
    name: gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Decide whether to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Dispatched by hand; deploying $SHA."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only what this push started counts. A soak someone dispatched by
          # hand, or a nightly, attaches to the same commit and can run for
          # hours; waiting on it would hold the deploy behind work that has
          # nothing to say about this commit.
          for workflow in "Rust CI" "Fuzz"; do
            deadline=$((SECONDS + 1800))
            while :; do
              states=$(gh run list --repo "$REPO" --commit "$SHA" --workflow "$workflow" --event push --json status,conclusion --jq '.[] | "\(.status)/\(.conclusion // "-")"')
              if [ -z "$states" ]; then
                echo "$workflow: no push-triggered run for this commit -- filtered out, not pending."
                break
              fi
              if ! echo "$states" | grep -qv '^completed/'; then
                break
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$workflow: still running after 30 minutes. Not deploying."
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "$workflow: not finished yet; waiting."
              sleep 30
            done
            if [ -n "$states" ] && echo "$states" | grep -qv '^completed/success$'; then
              echo "$workflow: did not succeed ($states). Not deploying."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ -n "$states" ] && echo "$workflow: success." || true
          done

          # Waiting above takes minutes, and main can move during them.
          # Publish only what is currently the tip: an older commit arriving
          # here means a newer one exists, and that one's own checks bring it.
          tip=$(git ls-remote origin main | cut -f1)
          if [ "$SHA" != "$tip" ]; then
            echo "main is at $tip, not $SHA. That commit's own run deploys it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$SHA is the tip of main and its checks passed. Deploying."
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # `workflow_run` starts this workflow from the default branch, so the
      # commit to build has to be named rather than assumed.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install wasm-opt
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pages must already be enabled with "GitHub Actions" as its source. The
      # `enablement: true` input cannot do it: creating the site is a repository
      # setting, and `GITHUB_TOKEN` is refused with "Resource not accessible by
      # integration". Enabling it is a one-time manual step, in the repository
      # settings or through `gh api -X POST repos/OWNER/REPO/pages`.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # `build.sh` with no arguments builds the release profile, which is the
      # size gate rather than the app: the converter needs `--app`, and so does
      # anything that runs the front-end. It also runs `npm run build:ts`
      # itself, which is why the install has to come first.
      - name: Build the converter
        working-directory: web
        run: |
          npm ci
          bash ./build.sh --app

      # The site is index.html, style.css and build output beside them. Fail
      # here rather than deploying a page whose modules are missing.
      - name: Verify the built site
        shell: bash
        run: |
          set -euo pipefail

          test -f web/www/index.html
          test -f web/www/app.js
          for module in obj ply gltf fbx ktx2; do
            test -f "web/www/pkg/${module}_bg.wasm"
          done
          du -sh web/www

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
