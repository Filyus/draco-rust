name: Fuzz

# Coverage-guided fuzzing of every untrusted-input path in the workspace
# (level 1: bounded smoke on PR/push, with a longer soak on manual dispatch).
# Each corpus is persisted across runs via the GitHub Actions cache and
# re-seeded from the committed fixtures each run, so coverage never starts from
# zero even if the cache is evicted.
#
# ClusterFuzzLite (cflite_*.yml) provides the heavier continuous-fuzzing layer
# (crash dedup, batch mode); this workflow is the lightweight in-repo gate.

# Fuzz what the targets actually reach. The paths filter is what makes the
# comment below true: without it a README push starts a run, and because runs
# cancel each other, a few documentation pushes in a row leave the workflow's
# last conclusion at `cancelled` -- which the badge renders as failing.
# The lists are spelled twice on purpose: GitHub Actions does not resolve YAML
# anchors, so a shared alias would be read as an empty filter.
on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "crates/**"
      - "fuzz/**"
      - "testdata/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "crates/**"
      - "fuzz/**"
      - "testdata/**"
  # No scheduled (nightly) run: the smoke gate fires only when code changes.
  # Trigger a longer soak manually with `gh workflow run fuzz.yml`.
  #
  # The README badge is pinned to `?event=push` so it reports this gate rather
  # than the soaks: a campaign that runs for an hour per target is expected to
  # find things, and a finding is not a broken build. Read the soak's own
  # conclusion from the run list, not from the badge.
  workflow_dispatch:

# A change-triggered smoke run supersedes the one before it: they test the same
# thing, and the newer commit is the one worth the runner. A manual soak does
# not belong in that group -- it is an hour per target, and a documentation push
# landing in the middle of it used to cancel it and throw the whole campaign
# away. Each soak gets a group of its own, keyed by its run id, so nothing
# cancels it and nothing queues behind it.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('fuzz-soak-{0}', github.run_id) || format('fuzz-smoke-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  # One job per group of targets rather than one job for all of them. Groups
  # run concurrently, so a soak costs the wall-clock of its longest group
  # instead of the sum of every target -- which is what buys the bitstream
  # targets an hour each while the whole run still lands well inside the
  # six-hour job limit. The split is by risk, not by convenience: this
  # workspace's own encoder and decoder are where most findings come from, and
  # they get twice the budget of the groups that fuzz parsers for other
  # people's formats.
  #
  # Budgets follow the coverage curve, measured by the edges each target gained
  # in the last tenth of its own run. Every target reaches 99% of its final
  # coverage inside the first minute, so seconds are no longer what limits
  # coverage -- the corpus is, and past that the budget buys executions rather
  # than reach.
  #
  # `encode_drc` was given four hours on 2026-08-28 to find out what the tail
  # was worth, and the answer settles it: over 1,736,158 runs it ended at
  # 13,124 edges, and the second half of that -- two hours of runner -- bought
  # four of them. The last tenth bought one. Read against the same metric on
  # the two runs before it (+226, then +7), the tail is gone. Two hours keeps
  # roughly 900,000 executions, still more than any other target gets, and the
  # round-trip oracle it carries is the only one here that catches an encoder
  # writing a stream its own decoder refuses.
  #
  # `decode_drc` is at the parser budget for the same reason twice measured:
  # thirty minutes reached 7,033 edges where two hours had reached 7,030.
  #
  # Nothing is given the freed time, because nothing here is short of it. The
  # same runner-hours buy two soaks from different seeds instead of one twice
  # as long, and two independent runs explore more of a saturated corpus than
  # one does. Whether the surface itself grows is a question for the target's
  # input grammar, not for this file.
  #
  # One target per group, for the same reason: a group runs its targets in
  # sequence, so sharing a job made the soak cost their sum. Three readers in
  # one group were ninety minutes of wall clock for thirty minutes of work
  # each, and that group, not the hour-long bitstream ones, was what the whole
  # soak waited on. A job costs fourteen seconds of setup, so the split is
  # close to free, and it lets a budget be raised for one target without
  # lengthening anything else. It also stops a crash in one target from eating
  # into another's budget on a rerun.
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: decode
            name: draco decode
            targets: decode_drc
            soak_seconds: 1800
            inherit_key: fuzz-corpus-v3-draco-
          - group: encode
            name: draco encode
            targets: encode_drc
            soak_seconds: 7200
            # Coverage over the corpus showed the valence traversal at 0%.
            # `select_edgebreaker_traversal` leaves the standard walk only at
            # 1,000 faces, a face costs three `u16` in this target's grammar,
            # and libFuzzer's default `-max_len` of 4,096 leaves room for 680:
            # the threshold was unreachable by construction. 16,384 covers the
            # grammar's own 2,048-face ceiling, and `-len_control=0` stops
            # libFuzzer from spending the run growing into it a few bytes at a
            # time.
            #
            # Length alone does not get there -- measured, the valence files
            # stayed at 0% after a run with these flags and a fresh corpus.
            # Random index triples do not form a connected mesh that large, so
            # the traversal is reached from the seed corpus rather than found:
            # `valence_traversal_grid_mesh.bin` is a 24x24 grid, 1,058 faces,
            # and it alone covers 93% of the valence encoder. The flags then
            # decide what can be built on top of it: with no `-max_len`
            # libFuzzer takes the limit from the largest seed, which pins the
            # run at the grid's own 6,641 bytes and no larger mesh than the one
            # it was handed.
            extra_libfuzzer_args: "-max_len=16384 -len_control=0"
            inherit_key: fuzz-corpus-v3-draco-
          - group: mesh_text
            name: OBJ/PLY/STL readers
            targets: mesh_text_readers
            soak_seconds: 1800
            inherit_key: fuzz-corpus-v3-readers-
          - group: fbx_read
            name: FBX reader
            targets: fbx_read_scene
            soak_seconds: 1800
            inherit_key: fuzz-corpus-v3-readers-
          - group: fbx_round
            name: FBX round trip
            targets: fbx_roundtrip
            soak_seconds: 1800
            inherit_key: fuzz-corpus-v3-readers-
          - group: gltf_compress
            name: glTF compression
            targets: compress_gltf
            soak_seconds: 1800
            inherit_key: fuzz-corpus-v3-gltf-
          - group: gltf_import
            name: glTF import
            targets: draco_gltf_import
            soak_seconds: 1800
            inherit_key: fuzz-corpus-v3-gltf-
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Pick fuzz duration
        id: dur
        run: |
          # Manual dispatch = deep soak; change-triggered = quick smoke.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=${{ matrix.soak_seconds }}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=120" >> "$GITHUB_OUTPUT"
          fi

      # Keyed per group: the jobs run at the same time and each writes its own
      # entry, so a shared key would have them overwrite each other's corpus.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          # The whole corpus directory rather than this group's one target, so
          # that a group split off another one restores what the old entry
          # holds. The cost is that such an entry keeps its former sibling's
          # corpus frozen inside it; narrowing the path to
          # `fuzz/corpus/${{ matrix.targets }}` collects that back, once every
          # group has written an entry of its own and the fallback below is
          # doing nothing.
          path: fuzz/corpus
          key: fuzz-corpus-v3-${{ matrix.group }}-${{ github.run_id }}
          # The second key is what a group renamed or split off another one
          # falls back to on its first run: the cached path is the whole corpus
          # directory, so the entry written under the old group's name still
          # holds this group's targets. Harmless once the group has an entry of
          # its own, since the first key matches first.
          restore-keys: |
            fuzz-corpus-v3-${{ matrix.group }}-
            ${{ matrix.inherit_key }}

      - name: Seed corpus from fixtures
        run: |
          for target in ${{ matrix.targets }}; do
            ./fuzz/seed_corpus.sh "$target"
          done

      # Every target in the group runs, whichever way the ones before it went,
      # and the loop's own tally becomes the step's result. Fail-fast starved
      # the tail of the list instead: two soaks in a row ended on a crash in an
      # early target, and the last one never got a single second of either.
      #
      # -O builds in release mode WITHOUT cargo-fuzz's default debug-assertions
      # /overflow-checks, so the campaign targets shipped behavior. The decoder
      # intentionally wraps (matching C++) and keeps DRACO_DCHECK-equivalent
      # debug_assert! invariants that are compiled out in release; with those on
      # the fuzzer would trip on dev-time checks rather than real hazards.
      # Out-of-bounds indexing still panics in release and is still caught.
      - name: Fuzz
        run: |
          failed=""
          for target in ${{ matrix.targets }}; do
            echo "::group::$target"
            if cargo +nightly fuzz run -O "$target" --fuzz-dir fuzz \
              --target x86_64-unknown-linux-gnu -- \
              -max_total_time=${{ steps.dur.outputs.seconds }} \
              -rss_limit_mb=4096 -timeout=25 -print_final_stats=1 \
              ${{ matrix.extra_libfuzzer_args }}; then
              echo "$target: ok"
            else
              echo "$target: crashed"
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets crashed:$failed"
            exit 1
          fi

      - name: Minimize corpora
        if: always()
        run: |
          for target in ${{ matrix.targets }}; do
            cargo +nightly fuzz cmin -O "$target" --fuzz-dir fuzz \
              --target x86_64-unknown-linux-gnu
          done

      # Named per group: two jobs uploading under one artifact name collide.
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.group }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
