name: Fuzz

# Coverage-guided fuzzing of every untrusted-input path in the workspace
# (level 1: bounded smoke on PR/push, and a soak every night or on manual
# dispatch). Each corpus is persisted across runs via the GitHub Actions cache
# and re-seeded from the committed fixtures each run, so coverage never starts
# from zero even if the cache is evicted.
#
# ClusterFuzzLite (cflite_*.yml) is the heavier layer -- crash dedup, batch
# mode -- and stays on manual dispatch; this workflow is what actually
# accumulates campaign hours.

# Fuzz what the targets actually reach. The paths filter is what makes the
# comment below true: without it a README push starts a run, and because runs
# cancel each other, a few documentation pushes in a row leave the workflow's
# last conclusion at `cancelled` -- which the badge renders as failing.
# The lists are spelled twice on purpose: GitHub Actions does not resolve YAML
# anchors, so a shared alias would be read as an empty filter.
on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "crates/**"
      - "fuzz/**"
      - "testdata/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "crates/**"
      - "fuzz/**"
      - "testdata/**"
  # A soak every night, and one on demand with `gh workflow run fuzz.yml`.
  #
  # Nightly because what a soak finds is not a function of its length. Over
  # four soaks `compress_gltf` gained +81, +236 and +18 edges from one to the
  # next and `fbx_roundtrip` +37, +156 and +17: the growth is between runs,
  # not inside one, and lumpy enough that no single run predicts the next. A
  # series from different seeds is the only thing that averages it, and a
  # series is what a schedule produces and a person does not. The cache is the
  # other reason: GitHub evicts an entry untouched for seven days, and the
  # corpora live nowhere else. A nightly run keeps every entry warm.
  #
  # 02:00 UTC is where the runners are idle and no push is likely to land a
  # smoke run beside it. GitHub suspends a schedule after sixty days without
  # a commit, and attributes each run to whoever last touched this file; a
  # failure notifies that person, so the file is the place to look when the
  # nights go quiet.
  #
  # The README badge is pinned to `?event=push` so it reports the smoke gate
  # rather than the soaks: a campaign that runs for an hour per target is
  # expected to find things, and a finding is not a broken build. Read a
  # soak's own conclusion from the run list, not from the badge.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# A change-triggered smoke run supersedes the one before it: they test the same
# thing, and the newer commit is the one worth the runner. A soak does not
# belong in that group -- it is an hour per target, and a documentation push
# landing in the middle of it used to cancel it and throw the whole campaign
# away. Each soak, scheduled or dispatched, gets a group of its own keyed by its
# run id, so nothing cancels it and nothing queues behind it. Spelled as "not a
# smoke event" rather than by listing the soak events, so that a trigger added
# later lands on the safe side.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && format('fuzz-smoke-{0}', github.ref) || format('fuzz-soak-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One job per group of targets rather than one job for all of them. Groups
  # run concurrently, so a soak costs the wall-clock of its longest group
  # instead of the sum of every target -- which is what buys the bitstream
  # targets an hour each while the whole run still lands well inside the
  # six-hour job limit. The split is by risk, not by convenience: this
  # workspace's own encoder and decoder are where most findings come from, and
  # they get twice the budget of the groups that fuzz parsers for other
  # people's formats.
  #
  # Budgets follow the coverage curve, measured by the edges each target gained
  # in the last tenth of its own run. Every target reaches 99% of its final
  # coverage inside the first minute, so seconds are no longer what limits
  # coverage -- the corpus is, and past that the budget buys executions rather
  # than reach.
  #
  # `encode_drc` was given four hours on 2026-08-28 to find out what the tail
  # was worth, and the answer settles it: over 1,736,158 runs it ended at
  # 13,124 edges, and the second half of that -- two hours of runner -- bought
  # four of them. The last tenth bought one. Read against the same metric on
  # the two runs before it (+226, then +7), the tail is gone. Two hours keeps
  # roughly 900,000 executions, still more than any other target gets, and the
  # round-trip oracle it carries is the only one here that catches an encoder
  # writing a stream its own decoder refuses.
  #
  # `decode_drc` is at the parser budget for the same reason twice measured:
  # thirty minutes reached 7,033 edges where two hours had reached 7,030.
  #
  # Nothing is given the freed time, because nothing here is short of it. The
  # same runner-hours buy two soaks from different seeds instead of one twice
  # as long, and two independent runs explore more of a saturated corpus than
  # one does. Whether the surface itself grows is a question for the target's
  # input grammar, not for this file.
  #
  # One target per group, for the same reason: a group runs its targets in
  # sequence, so sharing a job made the soak cost their sum. Three readers in
  # one group were ninety minutes of wall clock for thirty minutes of work
  # each, and that group, not the hour-long bitstream ones, was what the whole
  # soak waited on. A job costs fourteen seconds of setup, so the split is
  # close to free, and it lets a budget be raised for one target without
  # lengthening anything else. It also stops a crash in one target from eating
  # into another's budget on a rerun.
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: decode
            name: draco decode
            targets: decode_drc
            soak_seconds: 1800
          - group: encode
            name: draco encode
            targets: encode_drc
            soak_seconds: 7200
            # Coverage over the corpus showed the valence traversal at 0%.
            # `select_edgebreaker_traversal` leaves the standard walk only at
            # 1,000 faces, a face costs three `u16` in this target's grammar,
            # and libFuzzer's default `-max_len` of 4,096 leaves room for 680:
            # the threshold was unreachable by construction. 16,384 covers the
            # grammar's own 2,048-face ceiling, and `-len_control=0` stops
            # libFuzzer from spending the run growing into it a few bytes at a
            # time.
            #
            # Length alone does not get there -- measured, the valence files
            # stayed at 0% after a run with these flags and a fresh corpus.
            # Random index triples do not form a connected mesh that large, so
            # the traversal is reached from the seed corpus rather than found:
            # `valence_traversal_grid_mesh.bin` is a 24x24 grid, 1,058 faces,
            # and it alone covers 93% of the valence encoder. The flags then
            # decide what can be built on top of it: with no `-max_len`
            # libFuzzer takes the limit from the largest seed, which pins the
            # run at the grid's own 6,641 bytes and no larger mesh than the one
            # it was handed.
            extra_libfuzzer_args: "-max_len=16384 -len_control=0"
          - group: mesh_text
            name: OBJ/PLY/STL readers
            targets: mesh_text_readers
            # `dict` names a libFuzzer dictionary under fuzz/dict/. The text
            # and JSON parsers here dispatch on whole keywords, and a
            # byte-flipping mutator reaches a keyword one correct byte at a
            # time; the dictionary hands it the token whole, so the run is
            # spent past the keyword rather than on spelling it. The bitstream
            # targets have none: their grammar is arithmetic on bytes, and
            # there is no token to hand over.
            #
            # Measured on 2026-09-02 from a freshly seeded corpus, sixty
            # seconds, two libFuzzer seeds each, with and without the
            # dictionary (edges, then features): the FBX reader +127 and
            # +215 edges; these readers +108 and +5; KTX2 +10 and +63; glTF
            # -21 and -137 edges but +171 and +221 features. A minute under
            # ASan is under two thousand executions for glTF and KTX2, so
            # only the FBX and text-reader gains are outside the noise, and
            # whether the glTF dictionary earns its place is a question for
            # the soaks that follow, not for that measurement.
            dict: mesh_text
            soak_seconds: 1800
          - group: mesh_text_round
            name: OBJ/PLY/STL round trip
            targets: mesh_text_roundtrip
            # The writers, which nothing fuzzed: their features were not even
            # enabled in the fuzz build. It found a corrupt PLY on its first
            # replay of the readers' own corpus -- a colour attribute with one
            # component declared three channels in the header and wrote one
            # byte -- so it starts at the parser budget rather than below it.
            dict: mesh_text
            soak_seconds: 1800
          - group: fbx_read
            name: FBX reader
            targets: fbx_read_scene
            dict: fbx
            soak_seconds: 1800
          - group: fbx_round
            name: FBX round trip
            targets: fbx_roundtrip
            dict: fbx
            soak_seconds: 1800
          - group: gltf_compress
            name: glTF compression
            targets: compress_gltf
            # The only target still climbing: +159 edges on 2026-08-28 and +143
            # on 2026-08-29, where every other parser here moved by single
            # digits or not at all. It is also the slowest per second -- 117,011
            # executions against the FBX reader's 5.5 million in the same half
            # hour -- so thirty minutes buys it far fewer attempts than the
            # number suggests. Two hours prices its tail the way four priced
            # `encode_drc`'s; groups run concurrently and `encode_drc` already
            # holds the soak at two hours, so this costs no wall clock.
            dict: gltf
            soak_seconds: 7200
          - group: gltf_import
            name: glTF import
            targets: draco_gltf_import
            dict: gltf
            soak_seconds: 1800
          - group: ktx2
            name: KTX2 transcode
            targets: ktx2_transcode
            # The one target this workflow did not run: it was wired into
            # ClusterFuzzLite only, and that layer is manual and has never
            # been dispatched, so no campaign had ever accumulated over the
            # KTX2 reader. Parser budget, like the other readers of formats
            # that are not this workspace's own.
            dict: ktx2
            soak_seconds: 1800
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Pick fuzz duration
        id: dur
        run: |
          # Change-triggered = quick smoke; anything else (the nightly schedule,
          # a manual dispatch) = deep soak. Same split as the concurrency group.
          case "${{ github.event_name }}" in
            push|pull_request) echo "seconds=120" >> "$GITHUB_OUTPUT" ;;
            *) echo "seconds=${{ matrix.soak_seconds }}" >> "$GITHUB_OUTPUT" ;;
          esac

      # Keyed per group: the jobs run at the same time and each writes its own
      # entry, so a shared key would have them overwrite each other's corpus.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          # This group's target only. The path used to be the whole corpus
          # directory so that a group split off another could inherit the old
          # entry, and every entry carried its former siblings' corpora frozen
          # inside it. Every group has written an entry of its own since, so
          # the inheritance is done and the path narrows to what this job
          # actually fuzzes. An entry saved under the wide path still restores
          # into the narrow one -- the archive holds relative paths -- so the
          # narrowing loses nothing on its first run. What it buys matters
          # once the run is nightly: nine entries a night against the
          # repository's 10 GB cache, each holding one corpus rather than the
          # largest one nine times over.
          #
          # A group added later starts from the seeds alone, which is the
          # fallback below; nothing else needs to be inherited.
          path: fuzz/corpus/${{ matrix.targets }}
          key: fuzz-corpus-v3-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-v3-${{ matrix.group }}-

      - name: Seed corpus from fixtures
        run: |
          for target in ${{ matrix.targets }}; do
            ./fuzz/seed_corpus.sh "$target"
          done

      # Every target in the group runs, whichever way the ones before it went,
      # and the loop's own tally becomes the step's result. Fail-fast starved
      # the tail of the list instead: two soaks in a row ended on a crash in an
      # early target, and the last one never got a single second of either.
      #
      # -O builds in release mode WITHOUT cargo-fuzz's default debug-assertions
      # /overflow-checks, so the campaign targets shipped behavior. The decoder
      # intentionally wraps (matching C++) and keeps DRACO_DCHECK-equivalent
      # debug_assert! invariants that are compiled out in release; with those on
      # the fuzzer would trip on dev-time checks rather than real hazards.
      # Out-of-bounds indexing still panics in release and is still caught.
      - name: Fuzz
        run: |
          # Absolute, because cargo-fuzz runs the target from the fuzz
          # project's own directory, and a path relative to the repository
          # would be resolved from there and not found.
          dict_arg=""
          if [ -n "${{ matrix.dict }}" ]; then
            dict_arg="-dict=$GITHUB_WORKSPACE/fuzz/dict/${{ matrix.dict }}.dict"
          fi
          failed=""
          for target in ${{ matrix.targets }}; do
            echo "::group::$target"
            if cargo +nightly fuzz run -O "$target" --fuzz-dir fuzz \
              --target x86_64-unknown-linux-gnu -- \
              -max_total_time=${{ steps.dur.outputs.seconds }} \
              -rss_limit_mb=4096 -timeout=25 -print_final_stats=1 \
              $dict_arg ${{ matrix.extra_libfuzzer_args }}; then
              echo "$target: ok"
            else
              echo "$target: crashed"
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets crashed:$failed"
            exit 1
          fi

      # The campaign above runs the shipped build, and that leaves a whole class
      # of check unfuzzed: `-O` compiles out every `debug_assert!` and every
      # overflow check, so no soak can ever fail on one. Replaying the corpus
      # under `-a`, which turns both back on, found two decoder sites the
      # campaign had run past for as long as it has existed -- an `i32` sum of
      # attacker-chosen varint deltas, and an octahedral invariant the decode
      # path cannot honour (37 and 3 corpus inputs respectively).
      #
      # A replay rather than a second campaign, and this is the point: fuzzing
      # *with* the checks on would let dev-time invariants steer the mutation
      # engine, which is what the comment above rejects. `-runs=0` executes each
      # corpus entry once and mutates nothing, so the campaign keeps targeting
      # shipped behaviour while the corpus it accumulates gets audited under the
      # checks. Measured at roughly a minute per target against corpora of
      # several thousand entries.
      #
      # `if: always()` because a crash in the campaign says nothing about
      # whether the corpus trips a check, and that answer is worth having on
      # exactly the run that crashed.
      - name: Replay corpus with debug assertions
        if: always()
        run: |
          failed=""
          for target in ${{ matrix.targets }}; do
            echo "::group::$target"
            if cargo +nightly fuzz run -O -a "$target" --fuzz-dir fuzz \
              --target x86_64-unknown-linux-gnu "fuzz/corpus/$target" -- \
              -runs=0 -rss_limit_mb=4096 -timeout=25; then
              echo "$target: corpus replayed clean"
            else
              echo "$target: a corpus entry failed the replay"
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::corpus entries failed the replay:$failed"
            exit 1
          fi

      - name: Minimize corpora
        if: always()
        run: |
          for target in ${{ matrix.targets }}; do
            cargo +nightly fuzz cmin -O "$target" --fuzz-dir fuzz \
              --target x86_64-unknown-linux-gnu
          done

      # Named per group: two jobs uploading under one artifact name collide.
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.group }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
