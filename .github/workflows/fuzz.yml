name: Fuzz

# Coverage-guided decode and glTF-compressor fuzzing (level 1: bounded smoke on
# PR/push, with a longer soak available on manual dispatch). The decode corpus
# is persisted across runs via the GitHub Actions cache and re-seeded from the
# committed fixtures each run, so coverage never starts from zero even if the
# cache is evicted.
#
# ClusterFuzzLite (cflite_*.yml) provides the heavier continuous-fuzzing layer
# (crash dedup, batch mode); this workflow is the lightweight in-repo gate.

# Fuzz what the targets actually reach. The paths filter is what makes the
# comment below true: without it a README push starts a run, and because runs
# cancel each other, a few documentation pushes in a row leave the workflow's
# last conclusion at `cancelled` -- which the badge renders as failing.
# The lists are spelled twice on purpose: GitHub Actions does not resolve YAML
# anchors, so a shared alias would be read as an empty filter.
on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "crates/**"
      - "fuzz/**"
      - "testdata/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "crates/**"
      - "fuzz/**"
      - "testdata/**"
  # No scheduled (nightly) run: the smoke gate fires only when code changes.
  # Trigger a longer soak manually with `gh workflow run fuzz.yml`.
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: decode_drc + glTF compression/import
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Pick fuzz duration
        id: dur
        run: |
          # Manual dispatch = deep soak; change-triggered = quick smoke.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=1800" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=120" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v2-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-v2-

      - name: Seed corpus from fixtures
        run: |
          ./fuzz/seed_corpus.sh decode_drc
          ./fuzz/seed_corpus.sh compress_gltf
          ./fuzz/seed_corpus.sh draco_gltf_import
          ./fuzz/seed_corpus.sh fbx_read_scene
          ./fuzz/seed_corpus.sh fbx_roundtrip
          ./fuzz/seed_corpus.sh encode_drc
          ./fuzz/seed_corpus.sh mesh_text_readers

      # The decode target includes legacy decode features so old bitstream paths
      # get coverage-guided fuzzing, not just deterministic fixture tests.
      #
      # -O builds in release mode WITHOUT cargo-fuzz's default debug-assertions
      # /overflow-checks, so the campaign targets shipped behavior. The decoder
      # intentionally wraps (matching C++) and keeps DRACO_DCHECK-equivalent
      # debug_assert! invariants that are compiled out in release; with those on
      # the fuzzer would trip on dev-time checks rather than real hazards.
      # Out-of-bounds indexing still panics in release and is still caught.
      # First in the list, and first on purpose: the OBJ, PLY and STL readers
      # parse untrusted files with no limits API of their own -- an audit of the
      # PLY one found a panic, a seven-second spin and a 48 GB reservation, all
      # driven by counts printed in a header -- and while it ran last it was the
      # target two soaks in a row never reached.
      - name: Fuzz mesh_text_readers
        id: fuzz_mesh_text_readers
        continue-on-error: true
        run: |
          cargo +nightly fuzz run -O mesh_text_readers --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1

      - name: Fuzz decode_drc
        id: fuzz_decode_drc
        continue-on-error: true
        run: |
          cargo +nightly fuzz run -O decode_drc --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1

      # The glTF targets parse untrusted glTF/GLB bytes. Repository fixtures and
      # committed self-contained seeds give libFuzzer valid structure before it
      # starts mutating; deterministic regressions still run in stable CI.
      - name: Fuzz compress_gltf
        id: fuzz_compress_gltf
        continue-on-error: true
        run: |
          cargo +nightly fuzz run -O compress_gltf --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1

      - name: Fuzz draco_gltf_import
        id: fuzz_draco_gltf_import
        continue-on-error: true
        run: |
          cargo +nightly fuzz run -O draco_gltf_import --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1

      # The FBX reader is the workspace's only hand-rolled untrusted binary
      # parser: file-controlled lengths feed allocations and array payloads go
      # through zlib. Its target uses FbxDecodeLimits::fuzzing(), well under
      # -rss_limit_mb, so any allocation failure reported here is a real bug
      # rather than a header legitimately asking for a lot of memory.
      - name: Fuzz fbx_read_scene
        id: fuzz_fbx_read_scene
        continue-on-error: true
        run: |
          cargo +nightly fuzz run -O fbx_read_scene --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1

      # Feeds reader output back through the writer, so the writer gets
      # coverage from scenes nobody would think to hand-build.
      - name: Fuzz fbx_roundtrip
        id: fuzz_fbx_roundtrip
        continue-on-error: true
        run: |
          cargo +nightly fuzz run -O fbx_roundtrip --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1

      # The only target that fuzzes the encoder rather than a parser: its input
      # is a geometry description, so the encoder sees index buffers, attribute
      # mappings and options no caller would write by hand. It also checks that
      # a stream the encoder accepted decodes.
      - name: Fuzz encode_drc
        id: fuzz_encode_drc
        continue-on-error: true
        run: |
          cargo +nightly fuzz run -O encode_drc --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1

      # Every target above runs whichever way the ones before it went, and this
      # is what turns their outcomes into the job's. Fail-fast starved the tail
      # of the list instead: two soaks in a row ended on a crash in an early
      # target, and the last one never got a single second of either.
      - name: Report fuzz outcomes
        if: always()
        env:
          OUTCOMES: |
            mesh_text_readers ${{ steps.fuzz_mesh_text_readers.outcome }}
            decode_drc ${{ steps.fuzz_decode_drc.outcome }}
            compress_gltf ${{ steps.fuzz_compress_gltf.outcome }}
            draco_gltf_import ${{ steps.fuzz_draco_gltf_import.outcome }}
            fbx_read_scene ${{ steps.fuzz_fbx_read_scene.outcome }}
            fbx_roundtrip ${{ steps.fuzz_fbx_roundtrip.outcome }}
            encode_drc ${{ steps.fuzz_encode_drc.outcome }}
        run: |
          failed=""
          while read -r target outcome; do
            [ -n "$target" ] || continue
            echo "$target: $outcome"
            case "$outcome" in
              success | skipped) ;;
              *) failed="$failed $target" ;;
            esac
          done <<< "$OUTCOMES"
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets crashed:$failed"
            exit 1
          fi

      - name: Minimize corpora
        if: always()
        run: |
          for target in mesh_text_readers decode_drc compress_gltf draco_gltf_import fbx_read_scene fbx_roundtrip encode_drc; do
            cargo +nightly fuzz cmin -O "$target" --fuzz-dir fuzz \
              --target x86_64-unknown-linux-gnu
          done

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
