name: "Release: WASM assets"

# Each web module wraps one crate, so a crate's release publishes the browser
# assets for its own modules and stamps them with its own version.
#
# The push trigger is a fallback, not the usual route: publish.yml pushes its tag
# with GITHUB_TOKEN, and GitHub raises no workflow events for those, so it
# dispatches this workflow explicitly instead. The trigger stays for a tag pushed
# by hand.
on:
  push:
    tags:
      - "draco-core-v*"
      - "draco-io-v*"
      - "draco-gltf-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Crate release tag to build (draco-core-v*, draco-io-v*, draco-gltf-v*)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  wasm:
    name: Build WASM release assets
    runs-on: ubuntu-latest

    steps:
      - name: Select release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install wasm-opt
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build web WASM modules
        run: bash ./build.sh
        working-directory: web

      - name: Verify WASM modules
        shell: bash
        run: |
          set -euo pipefail

          test -d web/www/pkg
          test -n "$(find web/www/pkg -maxdepth 1 -name '*.wasm' -print -quit)"
          find web/www/pkg -maxdepth 1 -type f | sort

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          case "$tag" in
            draco-core-v*) crate="draco-core"; version="${tag#draco-core-v}" ;;
            draco-io-v*) crate="draco-io"; version="${tag#draco-io-v}" ;;
            draco-gltf-v*) crate="draco-gltf"; version="${tag#draco-gltf-v}" ;;
            *) echo "unsupported release tag: $tag" >&2; exit 1 ;;
          esac
          mkdir -p dist

          # Which crate each module wraps, and therefore whose version the asset
          # may carry. Every tag used to ship every module: a draco-io release
          # attached a draco-gltf-wasm zip stamped with the draco-io version,
          # naming a draco-gltf release that did not exist.
          # An empty owner means "ships with nothing", which is a decision rather
          # than an omission -- ktx2-wasm wraps draco-texture, and that crate is
          # `publish = false`, so no tag or crates.io version exists for an asset
          # to carry. Recorded here so the check below can tell it apart from a
          # module nobody placed.
          declare -A owner=(
            [obj]="draco-io"
            [ply]="draco-io"
            [stl]="draco-io"
            [fbx]="draco-io"
            [gltf]="draco-gltf"
            [drc]="draco-core"
            [ktx2]=""
          )

          # A module that is built and appears nowhere above is a module someone
          # forgot to place -- which is how stl and drc came to be built on every
          # release and shipped on none. Fail here rather than ship a short set.
          for built in web/www/pkg/*_bg.wasm; do
            name="$(basename "$built" _bg.wasm)"
            if [ -z "${owner[$name]+set}" ]; then
              echo "Module '$name' is built but assigned to no crate; add it to the owner map" >&2
              echo "(an empty value means it deliberately ships with no release)." >&2
              exit 1
            fi
          done

          modules=()
          skipped=()
          for name in "${!owner[@]}"; do
            case "${owner[$name]}" in
              "$crate") modules+=("$name") ;;
              "") skipped+=("$name") ;;
            esac
          done
          # Say what is not being shipped, so a short set is never silent.
          [ "${#skipped[@]}" -gt 0 ] && echo "Not shipped with any release: ${skipped[*]}"
          if [ "${#modules[@]}" -eq 0 ]; then
            echo "No web modules belong to $crate; nothing to package." >&2
            exit 1
          fi
          echo "Packaging for $crate v$version: ${modules[*]}"

          for module in "${modules[@]}"; do
            package_name="draco-${module//_/-}-wasm-v${version}"
            mkdir -p "dist/${package_name}"

            cp "web/www/pkg/${module}.js" "dist/${package_name}/"
            cp "web/www/pkg/${module}.d.ts" "dist/${package_name}/"
            cp "web/www/pkg/${module}_bg.wasm" "dist/${package_name}/"
            cp "web/www/pkg/${module}_bg.wasm.d.ts" "dist/${package_name}/"
            cp "web/www/pkg/LICENSE" "dist/${package_name}/"

            (cd "dist/${package_name}" && zip -r "../${package_name}.zip" .)
            rm -rf "dist/${package_name}"
          done

          find dist -maxdepth 1 -type f | sort

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" dist/*.zip --clobber
