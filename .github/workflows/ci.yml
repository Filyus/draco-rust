name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Check crates formatting
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: Check web formatting
        run: cargo fmt --manifest-path web/Cargo.toml --all -- --check

      - name: Test draco-core (full suite)
        # These Rust/C++ parity tests invoke locally built Windows
        # `draco_decoder.exe` / `draco_encoder.exe`, and panic rather than skip
        # when the binary is absent. Keep them in the local Windows suite, but
        # run every self-contained core test on Linux CI. A new one belongs on
        # this list the moment it calls `find_cpp_tool`.
        run: >-
          cargo test --manifest-path crates/Cargo.toml -p draco-core --
          --skip compare_rust_vs_cpp_decode
          --skip rust_encode_cpp_decode_small_matrix
          --skip cpp_decodes_the_legacy_streams_this_crate_writes
          --skip cpp_decodes_legacy_normal_and_tex_coord_encodings
          --skip cpp_decodes_the_predictive_traversal_this_crate_writes

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      # Feature-combination compile guard. Default tests enable every feature,
      # which hides feature-gating mistakes (e.g. a decoder module that secretly
      # needs point_cloud_decode).
      #
      # This is a full powerset rather than a hand-picked list because a list
      # missed the bug it was written for. The five combinations checked here
      # before -- none, decoder, decoder+point_cloud_decode, encoder,
      # all-features -- did not fail when carries_transform_byte was gated on
      # point_cloud_decode alone, because the mesh decoder's call sites sit
      # behind legacy_bitstream_decode, which no entry enabled except
      # all-features, where point_cloud_decode is on too and everything agrees.
      # The broken configuration was decoder+legacy_bitstream_decode, one pair
      # away from two of the entries and covered by neither.
      #
      # debug_logs and force_sequential_seeds are excluded: they gate logging
      # and a test seed rather than any cfg the modules are shaped by, and
      # including them doubles the run twice over. They are checked once each,
      # on top of the defaults, in the step below.
      - name: Check draco-core feature combinations
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo hack check --manifest-path crates/Cargo.toml -p draco-core \
            --feature-powerset --no-dev-deps \
            --exclude-features debug_logs,force_sequential_seeds

      - name: Check draco-core auxiliary feature flags
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --manifest-path crates/Cargo.toml -p draco-core --features debug_logs
          cargo check --manifest-path crates/Cargo.toml -p draco-core --features force_sequential_seeds

      - name: Test draco-io
        run: cargo test --manifest-path crates/Cargo.toml -p draco-io --features test

      # Lock in the low-level glTF contracts consumed by draco-gltf and the
      # WASM wrappers.
      - name: Check draco-io feature combinations
        run: |
          cargo test --manifest-path crates/Cargo.toml -p draco-io --no-default-features --doc
          cargo test --manifest-path crates/Cargo.toml -p draco-io --no-default-features --features gltf-container
          cargo test --manifest-path crates/Cargo.toml -p draco-io --no-default-features --features gltf-geometry
          cargo test --manifest-path crates/Cargo.toml -p draco-io --no-default-features --features draco-decode

      # draco-io has eighteen features, so its full powerset is 18,513
      # configurations -- not a thing CI can run. Depth 2 is 150 and covers
      # every pair, which is the shape these gating mistakes take: an item
      # gated on one feature whose callers sit behind another. The steps above
      # and below stay because they run tests, not just a compile.
      - name: Check draco-io feature pairs
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo hack check --manifest-path crates/Cargo.toml -p draco-io \
            --feature-powerset --depth 2 --no-dev-deps

      # FBX is the only hand-rolled untrusted binary parser in the workspace,
      # so every feature slice of it needs to keep compiling on its own. The
      # reader without `compression` must still build and report a precise
      # error rather than fail to compile.
      - name: Check draco-io FBX feature combinations
        run: |
          cargo build --manifest-path crates/Cargo.toml -p draco-io --no-default-features
          cargo test --manifest-path crates/Cargo.toml -p draco-io --no-default-features --features fbx-reader
          cargo test --manifest-path crates/Cargo.toml -p draco-io --no-default-features --features fbx-reader,compression
          cargo test --manifest-path crates/Cargo.toml -p draco-io --no-default-features --features fbx-writer
          cargo test --manifest-path crates/Cargo.toml -p draco-io --no-default-features --features fbx-reader,fbx-writer,compression

      - name: Test draco-gltf
        run: cargo test --manifest-path crates/Cargo.toml -p draco-gltf --features test

      # 58 configurations on the host target, then the wasm32 builds the
      # powerset does not reach -- it varies features, not targets.
      - name: Check draco-gltf feature/target combinations
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo hack check --manifest-path crates/Cargo.toml -p draco-gltf \
            --feature-powerset --no-dev-deps
          cargo check --manifest-path crates/Cargo.toml -p draco-gltf --target wasm32-unknown-unknown --features full
          cargo check --manifest-path crates/Cargo.toml -p draco-gltf --target wasm32-unknown-unknown --no-default-features --features read,draco-decode
          cargo check --manifest-path crates/Cargo.toml -p draco-gltf --target wasm32-unknown-unknown --no-default-features --features read,draco-decode,strict-validation
          cargo check --manifest-path web/Cargo.toml -p gltf-wasm --target wasm32-unknown-unknown --no-default-features
          cargo check --manifest-path web/Cargo.toml -p gltf-wasm --target wasm32-unknown-unknown --no-default-features --features read
          cargo check --manifest-path web/Cargo.toml -p gltf-wasm --target wasm32-unknown-unknown --no-default-features --features read,draco-decode
          cargo check --manifest-path web/Cargo.toml -p gltf-wasm --target wasm32-unknown-unknown --no-default-features --features strict-validation
          cargo check --manifest-path web/Cargo.toml -p gltf-wasm --target wasm32-unknown-unknown --no-default-features --features accessors
          cargo check --manifest-path web/Cargo.toml -p gltf-wasm --target wasm32-unknown-unknown --no-default-features --features raw-resources
          cargo check --manifest-path web/Cargo.toml -p gltf-wasm --target wasm32-unknown-unknown --no-default-features --features write
          cargo check --manifest-path web/Cargo.toml -p gltf-wasm --target wasm32-unknown-unknown --no-default-features --features write,draco-decode
          cargo check --manifest-path web/Cargo.toml -p gltf-wasm --target wasm32-unknown-unknown --no-default-features --features draco-encode
          cargo check --manifest-path crates/Cargo.toml -p draco-io --target wasm32-unknown-unknown --no-default-features --features draco-decode

      - name: Check public Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --manifest-path crates/Cargo.toml -p draco-io --all-features --no-deps
          cargo doc --manifest-path crates/Cargo.toml -p draco-gltf --all-features --no-deps

      # The texture crate is split two ways: by codec, and by the family of
      # hardware each block-format target serves, so a build can drop the one
      # its machines have outgrown along with the tables it carries. Each
      # slice has to keep building on its own, warnings included - a helper
      # that only one family uses goes dead in the builds without it, and that
      # is exactly what these catch.
      - name: Check draco-texture feature combinations
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo hack check --manifest-path crates/Cargo.toml -p draco-texture \
            --feature-powerset --no-dev-deps
          cargo check --manifest-path crates/Cargo.toml -p draco-texture --no-default-features --features etc1s,uastc,bc
          cargo check --manifest-path crates/Cargo.toml -p draco-texture --no-default-features --features etc1s,uastc,etc,astc
          cargo check --manifest-path crates/Cargo.toml -p draco-texture --target wasm32-unknown-unknown
          cargo check --manifest-path web/Cargo.toml -p ktx2-wasm --target wasm32-unknown-unknown --no-default-features --features bc
          cargo check --manifest-path web/Cargo.toml -p ktx2-wasm --target wasm32-unknown-unknown --no-default-features --features etc,astc
          # A build with the mobile ETC path left out. Not a retirement - ETC1S
          # has no ASTC target, so this build shows an ETC1S texture as pixels
          # on a phone - but the slice a desktop deployment would take.
          cargo check --manifest-path crates/Cargo.toml -p draco-texture --no-default-features --features etc1s,uastc,bc,astc
          cargo check --manifest-path web/Cargo.toml -p ktx2-wasm --target wasm32-unknown-unknown --no-default-features --features bc,astc

      - name: Test draco-texture
        run: cargo test --manifest-path crates/Cargo.toml -p draco-texture

      - name: Check fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

      - name: Test web workspace
        run: cargo test --manifest-path web/Cargo.toml --workspace

      - name: Clippy Rust crates
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Clippy web workspace
        run: cargo clippy --manifest-path web/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Package draco-core
        run: cargo package --manifest-path crates/draco-core/Cargo.toml

      - name: Test packaged draco-io and draco-gltf archives
        shell: pwsh
        run: ./.github/scripts/test-packaged-crates.ps1

  web-runtime:
    name: WASM runtime and browser smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install wasm-opt
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Install Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web test tools
        run: npm ci --ignore-scripts
        working-directory: web

      # tests/ is real TypeScript, checked against the same tsconfig Node runs
      # it through (rootDir covers src/ too, so a signature change on the
      # front-end side that a test relies on fails here, not at runtime).
      - name: Typecheck the test suite
        run: npm run typecheck:tests
        working-directory: web

      - name: Build optimized WASM and report module sizes
        run: bash ./build.sh
        working-directory: web

      # The step above builds the release profile, which is the artifact
      # web/wasm-sizes.md records and therefore has to stay feature-less. The
      # front-end calls readAccessor and bufferViewBytes, which only exist in
      # the converter profile, so the gates below need it built first.
      - name: Build converter glTF profile for the Node gates
        run: cargo run --manifest-path build-tool/Cargo.toml -- --app --module gltf-wasm --force
        working-directory: web

      - name: Run Node binding smoke
        run: npm run test:node
        working-directory: web

      # The scene model has no browser dependency, so these run here rather
      # than in the Playwright job. They need no fixture beyond testdata/;
      # test:scene-document-fbx skips its Mixamo and Samba legs by itself and
      # keeps running its glTF-sourced one. The suites left out need locally
      # installed source models (test:fbx-scene-provenance) or Blender
      # (test:scene-document-glb).
      - name: Run scene model and material gates
        run: |
          npm run test:scene-document
          npm run test:scene-document-viewer
          npm run test:gltf-materials
          npm run test:gltf-material-parity
          npm run test:gltf-summary-parity
          npm run test:gltf-quantized-morph
          npm run test:scene-document-fbx-morph
          npm run test:fbx-axis-basis
          npm run test:fbx-export-space
          npm run test:fbx-geometric-transform
          npm run test:no-absolute-paths
          npm run test:no-dev-paths
          npm run test:blender-resolver
          npm run test:export-branches
          npm run test:fbx-export-interpretation
          npm run test:scene-document-samplers
          npm run test:gltf-accessor-dedup
          npm run test:gltf-corpus
          npm run test:gltf-draco-corpus
          npm run test:gltf-draco-feature-ids
          npm run test:gltf-draco-references
          npm run test:gltf-draco-decode-failure
          npm run test:gltf-build-profile
          npm run test:fbx-rotation-basis
          npm run test:fbx-material-split
          npm run test:fbx-curve-geometry
          npm run test:viewer-joint-palette
          npm run test:viewer-shared-buffers
          npm run test:viewer-point-clouds
          npm run test:warning-collapse
          npm run test:viewer-limit-warnings
          npm run test:viewer-texture-units
          npm run test:viewer-alpha-order
          npm run test:gltf-scene-provenance
          npm run test:gltf-extension-support
          npm run test:extension-reach
          npm run test:export-helpers
          npm run test:scene-document-attributes
          npm run test:scene-document-fbx
        working-directory: web

      # The transcoder is compared against Binomial's own build of the Basis
      # transcoder, which lives outside this repository. Without it the gate
      # skips and says so, so what this step proves on a runner is that the
      # module still builds and still reports its size. What proves the
      # bytes on a runner is the `basis-crosscheck` job below.
      - name: Build and smoke the KTX2 transcoder
        run: |
          cargo run --manifest-path build-tool/Cargo.toml -- --module ktx2-wasm --force
          npm run test:ktx2-etc1s
          npm run test:ktx2-uastc
          npm run test:ktx2-block-formats
          npm run test:ktx2-uastc-modes
          npm run test:ktx2-differential
          npm run test:ktx2-format-choice
        working-directory: web

      - name: Build and smoke raw glTF writer
        run: |
          cargo run --manifest-path build-tool/Cargo.toml -- --module gltf-wasm --features write --force
          npm run test:gltf-write
        working-directory: web

      - name: Build and smoke Draco glTF writer
        run: |
          cargo run --manifest-path build-tool/Cargo.toml -- --module gltf-wasm --features write,draco-encode --force
          npm run test:gltf-draco-write
        working-directory: web

      - name: Build and smoke glTF raw write profile
        run: |
          cargo run --manifest-path build-tool/Cargo.toml -- --module gltf-wasm --features write --force
          npm run test:gltf-features -- --write
        working-directory: web

      - name: Build and smoke glTF accessor profile
        run: |
          cargo run --manifest-path build-tool/Cargo.toml -- --module gltf-wasm --features accessors --force
          npm run test:gltf-features -- --accessors
        working-directory: web

      - name: Build and smoke strict glTF reader profile
        run: |
          cargo run --manifest-path build-tool/Cargo.toml -- --module gltf-wasm --features strict-validation --force
          npm run test:gltf-features -- --strict-validation
        working-directory: web

      - name: Build and smoke glTF Draco encode profile
        run: |
          cargo run --manifest-path build-tool/Cargo.toml -- --module gltf-wasm --features write,draco-encode --force
          npm run test:gltf-features -- --write --draco-encode
        working-directory: web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Build converter glTF profile
        run: cargo run --manifest-path build-tool/Cargo.toml -- --app --module gltf-wasm --force
        working-directory: web

      - name: Run browser smoke
        run: npm run test:browser
        working-directory: web

  gltf-interop:
    name: Khronos and Google glTF interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned validator and decoder
        run: npm ci --ignore-scripts
        working-directory: web

      # gltf-interop.ts has no package.json of its own; it borrows the
      # TypeScript install web/ just fetched rather than needing a second one.
      - name: Typecheck the interop script
        run: web/node_modules/.bin/tsc --noEmit -p .github/scripts/tsconfig.json

      - name: Decode official Box_Draco with Rust
        run: >-
          cargo run --manifest-path crates/Cargo.toml -p draco-gltf
          --example gltf_tool --
          testdata/Box/glTF_Binary/Box_Draco.glb

      - name: Produce a Draco GLB with Rust
        run: |
          mkdir -p target/gltf-interop
          cargo run --manifest-path crates/Cargo.toml -p draco-gltf \
            --example gltf_tool -- \
            testdata/Box/glTF/Box.gltf target/gltf-interop/rust-box.glb

      - name: Validate and decode Rust output independently
        run: >-
          node .github/scripts/gltf-interop.ts
          target/gltf-interop/rust-box.glb
          testdata/Box/glTF/Box.gltf

  basis-parity:
    name: basis parity
    runs-on: ubuntu-latest

    # The reference transcoder itself, vendored at the revision draco-texture
    # was ported from and compiled here. This is what the node gates would do
    # if their oracle were not a prebuilt WASM living outside the repository.
    #
    # It is the only check that can reach the ETC1S-to-ASTC pair: the reference
    # has two branches behind BASISD_SUPPORT_ASTC_HIGHER_OPAQUE_QUALITY that an
    # emscripten build compiles out and a native one compiles in, so the
    # configuration has to be ours to choose. It is set to the browser profile,
    # which is what this repository implements.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compare draco-texture against the reference transcoder
        run: cargo test --manifest-path tools/basis-cpp-oracle/Cargo.toml -- --nocapture


  draco-cpp-parity:
    name: draco C++ parity
    runs-on: ubuntu-latest

    # The comparisons against upstream Draco itself. They spawn its command
    # line encoder and decoder, so until this job existed they ran only on a
    # machine that happened to have a build of them -- which is to say by hand,
    # while a green CI said nothing about them.
    #
    # Two things make the result mean something. The reference is pinned to the
    # 1.5.7 tag, the version COMPATIBILITY.md records this port as targeting,
    # so a divergence reports a change here rather than upstream moving. And
    # DRACO_REQUIRE_CPP_TOOLS turns a tool that cannot be found into a failure:
    # every one of these tests otherwise returns quietly and passes, which is
    # indistinguishable from a comparison that ran and agreed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out upstream Draco at the version this port targets
        uses: actions/checkout@v4
        with:
          repository: google/draco
          ref: '1.5.7'
          path: draco-cpp

      - name: Build the upstream encoder, decoder and library
        run: >-
          cmake -S draco-cpp -B draco-cpp/build -DCMAKE_BUILD_TYPE=Release &&
          cmake --build draco-cpp/build --parallel
          --target draco_decoder draco_encoder draco

      - name: Compare against upstream Draco
        env:
          DRACO_CPP_SOURCE_DIR: ${{ github.workspace }}/draco-cpp
          DRACO_CPP_BUILD_DIR: ${{ github.workspace }}/draco-cpp/build
          DRACO_REQUIRE_CPP_TOOLS: '1'
        run: >-
          cargo test --manifest-path crates/Cargo.toml -p draco-core --release
          --test rust_vs_cpp_decode_test
          --test binary_compatibility_test
          --test compat_encoder_options
          --test rust_cpp_interop_test
          --test edgebreaker_attribute_seams_test
          --test encoder_diagnostic_test

      # The comparisons that link upstream's library rather than spawning its
      # tools. Its build script compiles them out when it cannot find a build,
      # leaving no test to fail, so DRACO_REQUIRE_CPP_BRIDGE makes that a build
      # error here.
      #
      # SWEEP_ASSERTED_ONLY confines the randomized sweep to the region it makes
      # claims about. It also explores 30-bit quantization, where both encoders
      # overflow by construction and upstream misbehaves rather than merely
      # disagreeing -- on a gcc build of the reference one of those cases has it
      # ask for memory without bound, reaching 11.5 GB before `std::bad_alloc`
      # takes the process down. The same case survives against an MSVC build, so
      # this is the toolchain the reference was built with and not the version:
      # released 1.5.7 and upstream `main` both do it.
      #
      # Dropping that exploration costs no assertion. What remains is every
      # claim the sweep makes -- no panics, both encoders agreeing on what is
      # encodable, and byte parity below 30 bits -- over 349 comparisons in 37s.
      - name: Compare against upstream Draco through the linked bridge
        env:
          DRACO_CPP_SOURCE_DIR: ${{ github.workspace }}/draco-cpp
          DRACO_CPP_BUILD_DIR: ${{ github.workspace }}/draco-cpp/build
          DRACO_REQUIRE_CPP_BRIDGE: '1'
          SWEEP_ASSERTED_ONLY: '1'
        run: >-
          cargo test --manifest-path crates/Cargo.toml
          -p draco-cpp-test-bridge --release
