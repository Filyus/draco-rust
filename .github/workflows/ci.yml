name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Check crates formatting
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: Check web formatting
        run: cargo fmt --manifest-path web/Cargo.toml --all -- --check

      - name: Test draco-core (unit + doc)
        run: cargo test --manifest-path crates/Cargo.toml -p draco-core --lib

      # Feature-combination compile guard. Default tests enable every feature,
      # which hides feature-gating mistakes (e.g. a decoder module that secretly
      # needs point_cloud_decode). Check the meaningful single-direction combos.
      - name: Check draco-core feature combinations
        run: |
          cargo check --manifest-path crates/Cargo.toml -p draco-core --no-default-features
          cargo check --manifest-path crates/Cargo.toml -p draco-core --no-default-features --features decoder
          cargo check --manifest-path crates/Cargo.toml -p draco-core --no-default-features --features decoder,point_cloud_decode
          cargo check --manifest-path crates/Cargo.toml -p draco-core --no-default-features --features encoder
          cargo check --manifest-path crates/Cargo.toml -p draco-core --all-features

      # Malformed-input / hardening regressions. Kept separate from the C++
      # interop integration tests (rust_*_cpp_*), which require the external
      # draco_decoder/draco_encoder tools not present on the CI runner.
      - name: Test draco-core malformed-input regressions
        run: cargo test --manifest-path crates/Cargo.toml -p draco-core --test drc_edge_cases_test

      - name: Test draco-io
        run: cargo test --manifest-path crates/Cargo.toml -p draco-io

      # draco-gltf compresses through the writer + the reader-agnostic geometry
      # decoder, without the glTF reader. Lock in that feature combination.
      - name: Check draco-io feature combinations
        run: |
          cargo check --manifest-path crates/Cargo.toml -p draco-io --no-default-features --features gltf-writer
          cargo check --manifest-path crates/Cargo.toml -p draco-io --no-default-features --features gltf-reader

      - name: Test draco-gltf
        run: cargo test --manifest-path crates/Cargo.toml -p draco-gltf

      # draco-gltf adds wasm support and an optional `image` feature (off = the
      # smaller wasm build). Neither is exercised by the web workspace (which
      # wraps draco-io), so guard the no-image build and the wasm32 target here.
      - name: Check draco-gltf feature/target combinations
        run: |
          cargo check --manifest-path crates/Cargo.toml -p draco-gltf --no-default-features
          cargo check --manifest-path crates/Cargo.toml -p draco-gltf --target wasm32-unknown-unknown
          cargo check --manifest-path crates/Cargo.toml -p draco-gltf --target wasm32-unknown-unknown --no-default-features

      - name: Test web workspace
        run: cargo test --manifest-path web/Cargo.toml --workspace

      - name: Package draco-core
        run: cargo package --manifest-path crates/draco-core/Cargo.toml

      # Full verification of draco-io requires the matching draco-core version
      # to exist on crates.io. Before publication, still check the package file
      # set and metadata through --list.
      - name: Check draco-io package file list
        run: cargo package --manifest-path crates/draco-io/Cargo.toml --list

      # draco-gltf depends on published draco-core + draco-io, so a full package
      # is not possible pre-publication; still verify its file set and metadata.
      - name: Check draco-gltf package file list
        run: cargo package --manifest-path crates/draco-gltf/Cargo.toml --list
