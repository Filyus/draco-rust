name: "Release: publish crate"
run-name: "release: publish ${{ inputs.crate }}"

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish
        required: true
        type: choice
        options:
          - draco-core
          - draco-io
          - draco-gltf

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CRATE: ${{ inputs.crate }}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}

    steps:
      - name: Resolve release SHA
        id: resolve
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "The publish workflow must be started from main, got '$GITHUB_REF_NAME'."
            exit 1
          fi
          release_sha="$GITHUB_SHA"
          if [ -z "$release_sha" ]; then
            echo "Unable to resolve the release SHA."
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Release SHA: $release_sha"

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.release_sha }}
          fetch-depth: 0

      - name: Read crate version
        id: version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('crates/$CRATE/Cargo.toml', 'rb'))['package']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $CRATE $version"

      - name: Ignore non-release commits
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          subject="$(git log -1 --pretty=%s)"
          expected="release: prepare $CRATE v$VERSION"
          echo "Commit subject: $subject"
          echo "Expected release subject: $expected"
          if [ "$subject" != "$expected" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit for $CRATE; nothing to publish."
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Check CI passed for this commit
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.resolve.outputs.release_sha }}
        run: |
          ci_url="$(gh run list \
            --workflow ci.yml --branch main --commit "$RELEASE_SHA" \
            --json conclusion,status,url --limit 20 \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .url' \
            | head -n 1)"
          if [ -z "$ci_url" ]; then
            echo "No successful Rust CI run found for $RELEASE_SHA. Wait for CI on main, then rerun."
            exit 1
          fi
          echo "Using successful CI run: $ci_url"

      # Fuzz is slower than Rust CI, so a release started as soon as CI goes
      # green would race it. Gate here rather than by watching the Actions tab.
      - name: Check fuzz passed for this commit
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.resolve.outputs.release_sha }}
        run: |
          fuzz_url="$(gh run list \
            --workflow fuzz.yml --branch main --commit "$RELEASE_SHA" \
            --json conclusion,status,url --limit 20 \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .url' \
            | head -n 1)"
          if [ -z "$fuzz_url" ]; then
            echo "No successful Fuzz run found for $RELEASE_SHA. Wait for it on main, then rerun."
            exit 1
          fi
          echo "Using successful fuzz run: $fuzz_url"

      - name: Install stable Rust
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Check changelog section exists
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -Fq "## [$VERSION]" "crates/$CRATE/CHANGELOG.md"; then
            echo "No changelog section for $VERSION in crates/$CRATE/CHANGELOG.md."
            exit 1
          fi

      - name: Check internal dependencies are published
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        run: |
          set -euo pipefail
          deps="$(python3 -c "
          import tomllib
          m = tomllib.load(open('crates/$CRATE/Cargo.toml', 'rb'))
          internal = {'draco-core', 'draco-io'}
          for name, spec in m.get('dependencies', {}).items():
              if name in internal and isinstance(spec, dict) and 'version' in spec:
                  print(name, spec['version'])
          ")"
          if [ -z "$deps" ]; then
            echo "$CRATE has no internal crate dependencies to verify."
          fi
          # Process substitution keeps the loop in this shell so a failure exits the step.
          while read -r name ver; do
            if [ -z "$name" ]; then continue; fi
            status="$(curl --user-agent "$CRATE-release-check" --silent --output /dev/null --write-out "%{http_code}" "https://crates.io/api/v1/crates/$name/$ver")"
            if [ "$status" != "200" ]; then
              echo "Dependency $name $ver (pinned by $CRATE) is not published on crates.io (status $status)."
              exit 1
            fi
            echo "Dependency $name $ver is published."
          done < <(printf '%s\n' "$deps")

      - name: Check semver compatibility
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        run: |
          set -euo pipefail
          status="$(curl --user-agent "$CRATE-release-check" --silent --output /dev/null --write-out "%{http_code}" "https://crates.io/api/v1/crates/$CRATE")"
          if [ "$status" = "200" ]; then
            cargo semver-checks --manifest-path "crates/$CRATE/Cargo.toml"
          elif [ "$status" = "404" ]; then
            echo "$CRATE is not published yet; skipping semver-checks for first release."
          else
            echo "Unexpected crates.io status while checking $CRATE: $status"
            exit 1
          fi

      - name: Install nightly Rust for docs.rs check
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        run: rustup toolchain install nightly --profile minimal

      - name: Verify docs.rs build
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo +nightly doc --manifest-path "crates/$CRATE/Cargo.toml" --no-deps --all-features

      - name: Check version is unpublished
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl --user-agent "$CRATE-release-check" --silent --output /dev/null --write-out "%{http_code}" "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "$CRATE $VERSION is already published."
            exit 1
          fi
          if [ "$status" != "404" ]; then
            echo "Unexpected crates.io status while checking $CRATE $VERSION: $status"
            exit 1
          fi

      - name: Check release tag is absent
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="$CRATE-v$VERSION"
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || tag_status=$?
          if [ "$tag_status" = "0" ]; then
            echo "Release tag '$tag' already exists."
            exit 1
          fi
          if [ "$tag_status" != "2" ]; then
            echo "Unable to check release tag '$tag'."
            exit "$tag_status"
          fi

      - name: Publish dry run
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        run: cargo publish --manifest-path "crates/$CRATE/Cargo.toml" --dry-run

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.should_publish == 'true' }}
    environment: release
    permissions:
      contents: write
      id-token: write
      # To start Release: WASM assets; see the step at the end of this job.
      actions: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Re-check release commit still matches
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('crates/$CRATE/Cargo.toml', 'rb'))['package']['version'])")"
          subject="$(git log -1 --pretty=%s)"
          expected="release: prepare $CRATE v$version"
          if [ "$version" != "$VERSION" ]; then
            echo "Crate version no longer matches preflight version '$VERSION'."
            exit 1
          fi
          if [ "$subject" != "$expected" ]; then
            echo "Release commit subject changed or is invalid. Expected: $expected; got: $subject"
            exit 1
          fi

      - name: Check version is unpublished
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          status="$(curl --user-agent "$CRATE-release-check" --silent --output /dev/null --write-out "%{http_code}" "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "$CRATE $VERSION is already published."
            exit 1
          fi
          if [ "$status" != "404" ]; then
            echo "Unexpected crates.io status while checking $CRATE $VERSION: $status"
            exit 1
          fi

      - name: Check release tag is absent
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          tag="$CRATE-v$VERSION"
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || tag_status=$?
          if [ "$tag_status" = "0" ]; then
            echo "Release tag '$tag' already exists."
            exit 1
          fi
          if [ "$tag_status" != "2" ]; then
            echo "Unable to check release tag '$tag'."
            exit "$tag_status"
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish --manifest-path "crates/$CRATE/Cargo.toml"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create release tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          tag="$CRATE-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$CRATE $VERSION"
          git push origin "refs/tags/$tag"

      - name: Extract changelog section
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' "crates/$CRATE/CHANGELOG.md" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $VERSION in crates/$CRATE/CHANGELOG.md."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          tag="$CRATE-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" \
            --title "$CRATE $VERSION" \
            --notes-file release-notes.md \
            --verify-tag

      # GitHub raises no workflow events for a ref pushed with GITHUB_TOKEN, so
      # `Release: WASM assets` never saw the tag created above and its browser
      # assets were quietly never built -- draco-io v0.3.0 and draco-gltf v0.2.0
      # were both published without any. Ask for the run rather than relying on
      # the push trigger, which stays for a tag pushed by hand.
      - name: Build WASM release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          tag="$CRATE-v$VERSION"
          gh workflow run release.yml --ref main --field tag="$tag"
          echo "Requested Release: WASM assets for $tag."
