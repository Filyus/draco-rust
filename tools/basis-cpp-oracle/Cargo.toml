[package]
name = "basis-cpp-oracle"
version = "0.0.0"
edition = "2021"
publish = false
description = "The reference Basis transcoder, vendored and built, as an oracle for draco-texture"
license = "Apache-2.0"

# Its own workspace on purpose: this compiles about 1.5 MB of C++ and nothing
# in the ordinary build or test cycle should wait for it.
[workspace]

[build-dependencies]
cc = "1.0"

[dependencies]
# Its own Zstd and its own hashing, rather than borrowing them from the crate
# it is an oracle for: preparing the input with the implementation under test
# would make the oracle depend on what it is meant to judge.
ruzstd = { version = "0.7", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
draco-texture = { path = "../../crates/draco-texture" }
